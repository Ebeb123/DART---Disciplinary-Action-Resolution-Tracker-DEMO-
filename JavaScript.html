        '</tr></thead>' +
        '<tbody class="divide-y divide-slate-200 dark:divide-neutral-800">' + items.map(function (s) {
          var top = (s.infraction_breakdown || [])[0];
          var attrs = studentAttrs(s);
          return '<tr class="hover:bg-slate-50/70 dark:hover:bg-neutral-950/40">' +
            '<td class="td"><div class="flex items-center gap-3"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-red-600 text-xs font-bold text-white">' + esc(initials(s.student_name)) + '</span>' +

            '<td class="td whitespace-nowrap">' + esc(s.last_offense_display) + '<span class="block text-xs muted">' + esc(s.last_infraction) + ' · ' + esc(s.last_sanction) + '</span></td>' +

          '</tr>';
        }).join('') + '</tbody>' +

  function loadConferences(force) {
    var c = state.conferences;
    if (c.loaded && !force) { renderConferences(); return; }
    var seq = ++c.seq;
    if (!c.items.length) $('#conferencesWrap').innerHTML = loadingBlock('Loading conferences…');
    setRefreshing('conferences', true);
    api('listConferences', {}).then(function (items) {
      if (seq !== c.seq) return;
      c.items = items || [];
      c.loaded = true;
      renderConferences();
    }).catch(function (err) {
      if (seq !== c.seq) return;
      notifyError(err);
      if (!c.items.length && !err.isAuth) $('#conferencesWrap').innerHTML = emptyBlock('Could not load conferences', errMsg(err), 'alert');
    }).then(function () {
      if (seq === c.seq) setRefreshing('conferences', false);
    });
  }

  function renderConferences() {
    var c = state.conferences;
    var q = c.search.trim().toLowerCase();
    var list = c.items.filter(function (x) {
      if (c.status && x.status !== c.status) return false;
      if (!q) return true;
      return [x.student_id, x.student_name, x.section, x.guardian_name, x.notes, x.outcome, x.status].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    $('#confCount').textContent = fmtNum(list.length) + ' conference' + (list.length === 1 ? '' : 's') + (c.status ? ' · ' + c.status : '') + (q ? ' · matching "' + c.search + '"' : '');
    if (!list.length) {
      $('#conferencesWrap').innerHTML = (q || c.status)
        ? emptyBlock('No matching conferences', 'Try a different search or status.', 'search')
        : emptyBlock('No conferences recorded', 'Use "Record Conference" or the button on the Escalation Watchlist.', 'message');
      return;
    }
    $('#conferencesWrap').innerHTML =
      '<div class="scrollbar-thin overflow-x-auto"><table class="min-w-full divide-y divide-slate-200 dark:divide-neutral-800">' +
        '<thead class="bg-slate-50 dark:bg-neutral-950/60"><tr>' +
          '<th class="th">Date</th><th class="th">Student</th><th class="th">Status</th><th class="th">Parent / Guardian</th><th class="th">Outcome &amp; Notes</th><th class="th">Recorded By</th><th class="th text-right">Actions</th>' +
        '</tr></thead>' +
        '<tbody class="divide-y divide-slate-200 dark:divide-neutral-800">' + list.map(function (x) {
          return '<tr class="hover:bg-slate-50/70 dark:hover:bg-neutral-950/40">' +
            '<td class="td whitespace-nowrap font-medium">' + esc(x.conference_date_display) + '</td>' +
            '<td class="td"><button type="button" class="text-left" data-action="view-history" data-id="' + esc(x.student_id) + '" data-name="' + esc(x.student_name) + '" data-section="' + esc(x.section) + '">' +
              '<span class="block whitespace-nowrap font-semibold hover:text-blue-600 dark:hover:text-blue-400">' + esc(x.student_name) + '</span>' +
              '<span class="block text-xs muted">' + esc(x.student_id) + ' · ' + esc(x.section) + '</span></button></td>' +
            '<td class="td">' + conferenceBadge(x.status) + '</td>' +
            '<td class="td">' + (x.guardian_name ? esc(x.guardian_name) : '<span class="muted">—</span>') + '</td>' +
            '<td class="td min-w-[220px] max-w-sm">' +
              (x.outcome ? '<p class="text-sm">' + esc(x.outcome) + '</p>' : '') +
              (x.notes ? '<p class="mt-0.5 truncate text-xs muted" title="' + esc(x.notes) + '">' + esc(x.notes) + '</p>' : '') +
              (!x.outcome && !x.notes ? '<span class="muted">—</span>' : '') + '</td>' +
            '<td class="td whitespace-nowrap text-xs muted">' + esc(x.recorded_by) + '<span class="block">' + esc(x.updated_at_display) + '</span></td>' +
            '<td class="td"><div class="flex justify-end gap-1.5 whitespace-nowrap">' +
              '<button type="button" class="btn btn-ghost btn-sm" data-action="edit-conference" data-conf=\'' + esc(JSON.stringify(x)) + '\' title="Edit">' + icon('edit', 'w-4 h-4') + '</button>' +
              (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm hover:!text-red-600" data-action="delete-conference" data-id="' + esc(x.conference_id) + '" data-name="' + esc(x.student_name) + '" title="Delete">' + icon('trash', 'w-4 h-4') + '</button>' : '') +
            '</div></td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>';
  }

  function openConferenceModal(conf, prefill) {
    var c = conf || {};
    var p = prefill || {};
    var isEdit = !!c.conference_id;
    var statusOptions = CONFERENCE_STATUSES.map(function (s) {
      var selected = (c.status || (isEdit ? '' : 'Scheduled')) === s;
      return '<option value="' + esc(s) + '"' + (selected ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
    openModal({
      title: isEdit ? 'Edit Parent Conference' : 'Record Parent Conference',
      size: 'max-w-2xl',
      body:
        '<form id="confForm" data-id="' + esc(c.conference_id || '') + '" class="space-y-4" novalidate autocomplete="off">' +
          '<div class="grid grid-cols-1 gap-4 sm:grid-cols-3">' +
            inputField('Student ID', 'c_student_id', c.student_id || p.id || '', { required: true, maxlength: 50 }) +
            inputField('Student Name', 'c_student_name', c.student_name || p.name || '', { required: true, maxlength: 120 }) +
            inputField('Section', 'c_section', c.section || p.section || '', { required: true, maxlength: 80 }) +
          '</div>' +
          '<div class="grid grid-cols-1 gap-4 sm:grid-cols-3">' +
            inputField('Conference Date', 'c_date', c.conference_date || todayIso(), { required: true, type: 'date' }) +
            '<div><label class="label" for="c_status">Status <span class="text-red-500">*</span></label><select id="c_status" class="input">' + statusOptions + '</select></div>' +
            inputField('Parent / Guardian', 'c_guardian', c.guardian_name || '', { maxlength: 120, placeholder: 'Full name' }) +
          '</div>' +
          '<div><label class="label" for="c_outcome">Outcome / Agreements</label><textarea id="c_outcome" class="input min-h-[70px] resize-y" maxlength="1000" placeholder="e.g. Parent agreed to monitor attendance; student signed behavior contract.">' + esc(c.outcome || '') + '</textarea></div>' +
          '<div><label class="label" for="c_notes">Notes</label><textarea id="c_notes" class="input min-h-[90px] resize-y" maxlength="2000" placeholder="Discussion points, attendees, follow-up date…">' + esc(c.notes || '') + '</textarea></div>' +
          (isEdit ? '<p class="text-xs muted">Recorded by ' + esc(c.recorded_by || '—') + ' · last updated ' + esc(c.updated_at_display || '—') + '</p>' : '') +
        '</form>',
      footer:
        '<button type="button" class="btn btn-secondary" data-action="modal-close">Cancel</button>' +
        '<button type="submit" form="confForm" id="confSave" class="btn btn-primary">' + icon('check', 'w-4 h-4') + (isEdit ? 'Save Changes' : 'Save Conference') + '</button>'
    });
  }

  function saveConference(form) {
    var payload = {
      conference_id: form.getAttribute('data-id') || '',
      student_id: $('#c_student_id').value.trim(),
      student_name: $('#c_student_name').value.trim(),
      section: $('#c_section').value.trim(),
      conference_date: $('#c_date').value,
      status: $('#c_status').value,
      guardian_name: $('#c_guardian').value.trim(),
      outcome: $('#c_outcome').value.trim(),
      notes: $('#c_notes').value.trim()
    };
    var firstInvalid = null;
    [['c_student_id', payload.student_id], ['c_student_name', payload.student_name], ['c_section', payload.section], ['c_date', payload.conference_date]].forEach(function (pair) {
      var el = $('#' + pair[0]);
      setInvalid(el, !pair[1]);
      if (!pair[1] && !firstInvalid) firstInvalid = el;
    });
    if (firstInvalid) { firstInvalid.focus(); return; }
    var btn = $('#confSave');
    setBtnLoading(btn, true, 'Saving…');
    api('saveConference', payload).then(function (res) {
      markDirty({ keepRecords: true });
      closeModal();
      toast(res.message || 'Conference saved.', 'success');
      if (state.view === 'conferences') loadConferences(true);
      if (state.view === 'watchlist') loadWatchlist(true);
      if (state.view === 'directory' && state.dirMode === 'students') loadStudents(true);
    }).catch(function (err) {
      setBtnLoading(btn, false);
      notifyError(err);
    });
  }

  function deleteConference(id, name) {
    confirmDialog({
      title: 'Delete conference record?',
      message: 'This permanently removes the conference record for ' + (name || 'this student') + '. The deletion is recorded in the audit log.',
      confirmText: 'Delete',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      api('deleteConference', id).then(function (res) {
        state.conferences.items = state.conferences.items.filter(function (x) { return x.conference_id !== id; });
        markDirty({ keepRecords: true, keepConferences: true });
        renderConferences();
        toast(res.message || 'Deleted.', 'success');
      }).catch(notifyError);
    });
  }

  // ==========================================================================

  function loadConfig(force) {
    renderCalendarCard();
    if (state.config.loaded && !force) { renderConfig(); return; }
    if (!state.config.loaded) $('#configGrid').innerHTML = '<div class="card lg:col-span-2">' + loadingBlock('Loading settings…') + '</div>';
    setRefreshing('config', true);
    Promise.all([api('getSettings', true), api('getCalendar')]).then(function (res) {
      state.settingsAll = res[0] || [];
      state.calendar = res[1] || state.calendar;
      state.config.loaded = true;
      state.config.editing = null;
      renderCalendarCard();
      renderConfig();
      populateFormSelects();
    }).catch(function (err) {
      notifyError(err);
      if (!err.isAuth) $('#configGrid').innerHTML = '<div class="card lg:col-span-2">' + emptyBlock('Could not load settings', errMsg(err), 'alert') + '</div>';
    }).then(function () {
      setRefreshing('config', false);
    });
  }

    return '<select id="' + id + '" class="input">' + MONTH_NAMES.map(function (m, i) {

      sem2Start: parseInt($('#cal_s2s').value, 10),

    for (var i = 0; i < state.settingsAll.length; i++) if (state.settingsAll[i].setting_id === id) return state.settingsAll[i];
    return null;

  function switchHtml(on, attrs, busy, title) {
    return '<button type="button" role="switch" aria-checked="' + on + '" ' + attrs + (busy ? ' disabled' : '') +
      ' class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition disabled:opacity-50 ' + (on ? 'bg-blue-600' : 'bg-slate-300 dark:bg-neutral-700') + '" title="' + esc(title || '') + '">' +
      '<span class="inline-block h-4 w-4 rounded-full bg-white shadow transition ' + (on ? 'translate-x-[18px]' : 'translate-x-0.5') + '"></span></button>';

        '</div>' +
        '<ul class="scrollbar-thin max-h-80 divide-y divide-slate-200 overflow-y-auto dark:divide-neutral-800">' +
          (items.length ? items.map(settingRow).join('') : '<li class="px-5 py-8 text-center text-sm muted">No options yet. Add one above.</li>') +
        '</ul>' +
      '</div>';
    }).join('');
    var editInput = $('#editSettingInput');
    if (editInput) { editInput.focus(); editInput.select(); }
  }

  function afterSettingsChange() {
    state.audit.loaded = false;
    renderConfig();
    populateFormSelects();
  }

  function addSetting(form) {
    var category = form.getAttribute('data-setting-add');
    var input = form.querySelector('input[name="value"]');
    var btn = form.querySelector('button[type="submit"]');
    var value = input.value.trim();
    if (!value) { setInvalid(input, true); input.focus(); return; }
    setInvalid(input, false);
    setBtnLoading(btn, true, '');
    input.disabled = true;
    api('addSetting', { category: category, value: value }).then(function (res) {
      state.settingsAll.push(res.setting);
      afterSettingsChange();
      toast(res.message || 'Option added.', 'success');
      var newForm = $('[data-setting-add="' + category + '"] input');
      if (newForm) newForm.focus();
    }).catch(function (err) {
      notifyError(err);
      setBtnLoading(btn, false);
      input.disabled = false;
      input.focus();
    });
  }

  function toggleSetting(id) {
    var s = findSetting(id);
    if (!s || state.config.busy[id]) return;
    state.config.busy[id] = true;
    renderConfig();
    api('updateSetting', { setting_id: id, is_active: !s.is_active }).then(function (res) {
      Object.assign(s, res.setting);
      toast('"' + s.value + '" is now ' + (s.is_active ? 'active' : 'inactive') + '.', 'success');
    }).catch(notifyError).then(function () {
      delete state.config.busy[id];
      afterSettingsChange();
    });
  }

  function saveSettingEdit(id) {
    var s = findSetting(id);
    var input = $('#editSettingInput');
    if (!s || !input) return;
    var value = input.value.trim();
    if (!value) { setInvalid(input, true); input.focus(); return; }
    if (value === s.value) { state.config.editing = null; renderConfig(); return; }
    state.config.busy[id] = true;
    input.disabled = true;
    api('updateSetting', { setting_id: id, value: value }).then(function (res) {
      Object.assign(s, res.setting);
      state.config.editing = null;
      toast('Option renamed to "' + s.value + '".', 'success');
    }).catch(notifyError).then(function () {
      delete state.config.busy[id];
      afterSettingsChange();
    });
  }

  function deleteSettingConfirm(id) {
    var s = findSetting(id);
    if (!s) return;
    confirmDialog({
      title: 'Delete "' + s.value + '"?',
      message: 'This removes the option from ' + s.category + '. Past incident records that used it are not changed. To hide it without deleting, switch it to inactive instead.',
      confirmText: 'Delete Option',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      state.config.busy[id] = true;
      renderConfig();
      api('deleteSetting', id).then(function (res) {
        state.settingsAll = state.settingsAll.filter(function (x) { return x.setting_id !== id; });
        toast(res.message || 'Option deleted.', 'success');
      }).catch(notifyError).then(function () {
        delete state.config.busy[id];
        afterSettingsChange();
      });
    });
  }

  function runSummary(format) {
    var btn = format === 'csv' ? $('#summaryCsvBtn') : $('#summaryPdfBtn');
    var other = format === 'csv' ? $('#summaryPdfBtn') : $('#summaryCsvBtn');
    var filter = $('#summaryFilter').value || 'ACADEMIC_YEAR';
    setBtnLoading(btn, true, format === 'csv' ? 'Preparing…' : 'Building PDF…');
    other.disabled = true;
    api('generateSummaryReport', filter, format).then(function (res) {
      if (format === 'csv') downloadFile(res.fileName, res.content, res.mimeType);
      else downloadBase64(res.fileName, res.base64, res.mimeType);
      var drive = safeUrl(res.drive_url);
      var box = $('#summaryResult');
      box.hidden = false;
      box.innerHTML =
        '<div class="flex items-start gap-3 rounded-xl border border-blue-200 bg-blue-50 p-4 dark:border-blue-500/30 dark:bg-blue-500/10">' +
          '<span class="text-blue-600 dark:text-blue-400">' + icon('check-circle') + '</span>' +
          '<div class="min-w-0 text-sm"><p class="font-semibold text-slate-900 dark:text-white">Summary ready · ' + esc(res.filter_label) + ' · ' + fmtNum(res.total) + ' incident' + (res.total === 1 ? '' : 's') + '</p>' +
          '<p class="mt-0.5 break-all font-mono text-xs muted">' + esc(res.fileName) + '</p>' +
          (drive ? '<a href="' + esc(drive) + '" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-blue-600 hover:underline dark:text-blue-400">' + icon('external', 'w-3.5 h-3.5') + 'Also saved to the DART - Reports folder in Drive</a>' : '') +
          '<p class="mt-2 text-xs muted">If the download didn\'t start, allow downloads for this site and try again.</p></div>' +
        '</div>';
      state.audit.loaded = false;
      toast('Summary report downloaded.', 'success');
    }).catch(notifyError).then(function () {
      setBtnLoading(btn, false);
      other.disabled = false;
    });
  }

  function runExport() {
    var btn = $('#exportBtn');
    var filter = $('#exportFilter').value || 'ALL';
    setBtnLoading(btn, true, 'Preparing…');
    api('exportViolationsCsv', filter).then(function (res) {
      var box = $('#exportResult');
      if (!res.rowCount) {
        toast('No records found for ' + (res.filter_label || 'that period') + '.', 'info');

          '<div class="min-w-0 text-sm"><p class="font-semibold text-slate-900 dark:text-white">' + fmtNum(res.rowCount) + ' record' + (res.rowCount === 1 ? '' : 's') + ' exported · ' + esc(res.filter_label) + '</p>' +

    var u = state.users;
    if (u.loaded && !force) { renderUsers(); return; }
    if (!u.items.length) $('#usersWrap').innerHTML = loadingBlock('Loading accounts…');
    api('listUsers').then(function (items) {
      u.items = items || [];
      u.loaded = true;
      renderUsers();
    }).catch(function (err) {
      notifyError(err);
      if (!u.items.length && !err.isAuth) $('#usersWrap').innerHTML = emptyBlock('Could not load accounts', errMsg(err), 'alert');

  function findUser(id) {
    for (var i = 0; i < state.users.items.length; i++) if (state.users.items[i].user_id === id) return state.users.items[i];
    return null;
  }

  function passwordFields(prefix) {

  function readPasswordFields(prefix) {

  function loadAudit(force) {
    var a = state.audit;
    if (a.loaded && !force) { renderAudit(); return; }
    if (!a.items.length) $('#auditWrap').innerHTML = loadingBlock('Loading audit log…');
    setRefreshing('audit', true);
    api('getAuditLog', { limit: 2000 }).then(function (items) {
      a.items = items || [];
      a.loaded = true;
      a.page = 1;
      renderAudit();
    }).catch(function (err) {
      notifyError(err);
      if (!a.items.length && !err.isAuth) $('#auditWrap').innerHTML = emptyBlock('Could not load audit log', errMsg(err), 'alert');
    }).then(function () {
      setRefreshing('audit', false);
    });
  }

  function auditActionBadge(action) {
    var cls = 'bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200';
    if (action === 'DELETE' || action === 'LOGIN_FAILED') cls = 'bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-400/30';
    else if (action === 'CREATE' || action === 'FIRST_ADMIN_CREATED') cls = 'bg-blue-600 text-white';
    else if (action === 'UPDATE' || /PASSWORD/.test(action)) cls = 'bg-amber-50 text-amber-800 ring-1 ring-inset ring-amber-600/20 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-400/30';
    else if (/REPORT|EXPORT/.test(action)) cls = 'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-600/20 dark:bg-blue-500/10 dark:text-blue-300 dark:ring-blue-400/30';
    return '<span class="badge ' + cls + '">' + esc(action.replace(/_/g, ' ')) + '</span>';
  }

  function auditDetails(text) {
    if (!text) return '<span class="muted">—</span>';
    try {
      var o = JSON.parse(text);
      return Object.keys(o).map(function (k) {
        var v = o[k];
        if (Array.isArray(v) && v.length === 2) {
          return '<div><span class="font-semibold">' + esc(k) + ':</span> <span class="text-red-600 line-through dark:text-red-400">' + esc(v[0] || '∅') + '</span> → <span class="text-blue-700 dark:text-blue-300">' + esc(v[1] || '∅') + '</span></div>';
        }
        return '<div><span class="font-semibold">' + esc(k) + ':</span> ' + esc(typeof v === 'object' ? JSON.stringify(v) : v) + '</div>';
      }).join('');
    } catch (e) {
      return esc(text);
    }
  }

  function renderAudit() {
    var a = state.audit;
    var q = a.search.trim().toLowerCase();
    var list = a.items.filter(function (x) {
      if (a.action && x.action !== a.action) return false;
      if (!q) return true;
      return [x.username, x.action, x.entity, x.entity_id, x.details].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    var pages = Math.max(1, Math.ceil(list.length / AUDIT_PAGE_SIZE));
    a.page = Math.min(Math.max(1, a.page), pages);
    var start = (a.page - 1) * AUDIT_PAGE_SIZE;
    var slice = list.slice(start, start + AUDIT_PAGE_SIZE);
    $('#auditCount').textContent = fmtNum(list.length) + ' entr' + (list.length === 1 ? 'y' : 'ies') + (a.items.length >= 2000 ? ' (latest 2,000 loaded)' : '');
    if (!list.length) {
      $('#auditWrap').innerHTML = emptyBlock('No matching entries', '', 'activity');
      return;
    }
    $('#auditWrap').innerHTML =
      '<div class="scrollbar-thin overflow-x-auto"><table class="min-w-full divide-y divide-slate-200 dark:divide-neutral-800">' +
        '<thead class="bg-slate-50 dark:bg-neutral-950/60"><tr>' +
          '<th class="th">When</th><th class="th">User</th><th class="th">Action</th><th class="th">Record</th><th class="th">Details</th>' +
        '</tr></thead>' +
        '<tbody class="divide-y divide-slate-200 dark:divide-neutral-800">' + slice.map(function (x) {
          return '<tr class="hover:bg-slate-50/70 dark:hover:bg-neutral-950/40">' +
            '<td class="td whitespace-nowrap text-xs">' + esc(x.timestamp_display) + '</td>' +
            '<td class="td whitespace-nowrap"><span class="font-mono text-xs">@' + esc(x.username) + '</span>' + (x.role ? '<span class="block text-[11px] muted">' + esc(x.role) + '</span>' : '') + '</td>' +
            '<td class="td">' + auditActionBadge(x.action) + '</td>' +
            '<td class="td whitespace-nowrap text-xs"><span class="font-semibold">' + esc(x.entity) + '</span><span class="block max-w-[220px] truncate font-mono muted" title="' + esc(x.entity_id) + '">' + esc(x.entity_id) + '</span></td>' +
            '<td class="td min-w-[240px] text-xs leading-relaxed">' + auditDetails(x.details) + '</td>' +
          '</tr>';
        }).join('') + '</tbody></table></div>' + pagerHtml(a.page, pages, start, slice.length, list.length, 'audit-prev', 'audit-next');
  }

  // ==========================================================================
  // 18. EVENT BINDING
  // ==========================================================================

  function readStudentAttrs(el) {
    return { id: el.getAttribute('data-id') || '', name: el.getAttribute('data-name') || '', section: el.getAttribute('data-section') || '' };
  }

  var ACTIONS = {
    'open-sidebar': function () { openSidebar(); },
    'close-sidebar': function () { closeSidebar(); },
    'toggle-theme': function () { toggleTheme(); },
    'modal-close': function () { closeModal(); },
    'privacy': function () { openPrivacyNotice(); },
    'logout': function () {
      confirmDialog(isDemo()
        ? { title: 'Leave admin mode?', message: 'You will return to the public demo view. Open the admin link again to come back.', confirmText: 'Sign out' }
        : { title: 'Sign out of DART?', message: 'You will need your username and password to sign in again.', confirmText: 'Sign out' })
        .then(function (ok) { if (ok) logout(); });
    },
    'change-password': function () { openChangePassword(); },
    'toggle-password': function (el) {
      var input = $('#' + el.getAttribute('data-target'));
      if (!input) return;
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      el.innerHTML = icon(show ? 'eye-off' : 'eye', 'w-4 h-4');
      el.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    },
    'generate-password': function (el) {
      var prefix = el.getAttribute('data-prefix');
      var pwd = generatePassword();
      var a = $('#' + prefix + 'Pass');
      var b = $('#' + prefix + 'Confirm');
      a.value = pwd; b.value = pwd; a.type = 'text';
      toast('Generated password: ' + pwd + ' — copy it before saving.', 'info', { duration: 15000 });
    },
    'toggle-switch': function (el) {
      var on = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', String(on));
      el.className = el.className.replace(/bg-blue-600|bg-slate-300 dark:bg-neutral-700/g, '').trim() + ' ' + (on ? 'bg-blue-600' : 'bg-slate-300 dark:bg-neutral-700');
      var knob = el.querySelector('span');
      knob.className = 'inline-block h-4 w-4 rounded-full bg-white shadow transition ' + (on ? 'translate-x-[18px]' : 'translate-x-0.5');
    },
    'dash-filter': function (el) {
      var f = el.getAttribute('data-filter');
      if (f === state.dash.filter && state.dash.loaded) return;
      state.dash.filter = f;
      renderTimeFilterControls();
      loadDashboard(true);
    },
    'refresh': function (el) {
      var t = el.getAttribute('data-target');
      if (t === 'dashboard') loadDashboard(true);
      if (t === 'directory') { if (state.dirMode === 'records') loadRecords(true); else loadStudents(true); }
      if (t === 'watchlist') loadWatchlist(true);
      if (t === 'conferences') loadConferences(true);
      if (t === 'config') loadConfig(true);
      if (t === 'audit') loadAudit(true);
    },
    'dir-mode': function (el) { setDirMode(el.getAttribute('data-mode')); },
    'page-prev': function () { state.records.page--; renderRecords(); $('#recordsWrap').scrollIntoView({ block: 'nearest' }); },
    'page-next': function () { state.records.page++; renderRecords(); $('#recordsWrap').scrollIntoView({ block: 'nearest' }); },
    'audit-prev': function () { state.audit.page--; renderAudit(); $('#auditWrap').scrollIntoView({ block: 'nearest' }); },
    'audit-next': function () { state.audit.page++; renderAudit(); $('#auditWrap').scrollIntoView({ block: 'nearest' }); },
    'report': function (el) { generateReport(el.getAttribute('data-id')); },
    'edit-record': function (el) { openEditModal(el.getAttribute('data-id')); },
    'delete-record': function (el) { deleteRecord(el.getAttribute('data-id')); },
    'view-history': function (el) { var s = readStudentAttrs(el); openHistory(s.id, s.name, s.section); },
    'log-for-student': function (el) { var s = readStudentAttrs(el); logForStudent(s.id, s.name, s.section); },
    'new-conference': function (el) { openConferenceModal(null, readStudentAttrs(el)); },
    'edit-conference': function (el) {
      var conf = null;
      try { conf = JSON.parse(el.getAttribute('data-conf')); } catch (e) { conf = null; }
      if (conf) openConferenceModal(conf);
    },
    'delete-conference': function (el) { deleteConference(el.getAttribute('data-id'), el.getAttribute('data-name')); },
    'pick-evidence': function () { $('#f_evidence_file').click(); },
    'remove-evidence': function () { clearEvidence(); },
    'reset-log': function () { resetLogForm(); $('#f_student_id').focus(); },
    'save-calendar': function () { saveCalendar(); },
    'setting-toggle': function (el) { toggleSetting(el.getAttribute('data-id')); },
    'setting-edit': function (el) { state.config.editing = el.getAttribute('data-id'); renderConfig(); },
    'setting-cancel': function () { state.config.editing = null; renderConfig(); },
    'setting-save': function (el) { saveSettingEdit(el.getAttribute('data-id')); },
    'setting-delete': function (el) { deleteSettingConfirm(el.getAttribute('data-id')); },
    'summary': function (el) { runSummary(el.getAttribute('data-format')); },
    'export': function () { runExport(); },
    'add-user': function () { openAddUser(); },
    'edit-user': function (el) { openEditUser(el.getAttribute('data-id')); },
    'reset-user-password': function (el) { openResetPassword(el.getAttribute('data-id')); },
    'delete-user': function (el) { deleteUser(el.getAttribute('data-id')); }
  };

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var navEl = e.target.closest('[data-nav]');
      if (navEl) {
        e.preventDefault();
        if (isModalOpen()) closeModal();
        showView(navEl.getAttribute('data-nav'));
        return;
      }
      var el = e.target.closest('[data-action]');
      if (!el || el.disabled) return;
      var handler = ACTIONS[el.getAttribute('data-action')];
      if (handler) {
        e.preventDefault();
        handler(el, e);
      }
    });

    document.addEventListener('submit', function (e) {
      var form = e.target;
      e.preventDefault();
      if (form.id === 'loginForm') submitLogin();
      else if (form.id === 'setupForm') submitSetup();
      else if (form.id === 'logForm') submitLog();
      else if (form.id === 'editForm') saveEdit(form);
      else if (form.id === 'confForm') saveConference(form);
      else if (form.id === 'userAddForm') saveAddUser();
      else if (form.id === 'userEditForm') saveEditUser(form);
      else if (form.id === 'userResetForm') saveResetPassword(form);
      else if (form.id === 'selfPassForm') saveChangePassword();
      else if (form.hasAttribute('data-setting-add')) addSetting(form);
    });

    document.addEventListener('keydown', function (e) {
      if (e.target && e.target.id === 'editSettingInput') {
        if (e.key === 'Enter') { e.preventDefault(); saveSettingEdit(e.target.getAttribute('data-id')); return; }
        if (e.key === 'Escape') { e.preventDefault(); state.config.editing = null; renderConfig(); return; }
      }
      if (e.key === 'Escape') {
        if (isModalOpen()) closeModal();
        else closeSidebar();
      }
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.id === 'evidenceDrop') {
        e.preventDefault();
        $('#f_evidence_file').click();
      }
    });

    document.addEventListener('input', function (e) {
      if (e.target && e.target.classList && e.target.classList.contains('input')) setInvalid(e.target, false);
    });

    // Log form: Student ID drives the lookup; Name/Section follow it
    $('#f_student_id').addEventListener('input', onStudentIdInput);
    $('#f_student_name').addEventListener('input', function () { state.autofill.name = false; $('#autofillHint').hidden = true; });
    $('#f_section').addEventListener('input', function () { state.autofill.section = false; $('#autofillHint').hidden = true; });
    $('#f_infraction').addEventListener('change', checkOffense);

    // Evidence: file picker + drag & drop
    $('#f_evidence_file').addEventListener('change', function (e) { handleEvidenceFile(e.target.files && e.target.files[0]); });
    var drop = $('#evidenceDrop');
    ['dragenter', 'dragover'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) { e.preventDefault(); drop.classList.add('!border-blue-600', 'bg-blue-50/50'); });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) { e.preventDefault(); drop.classList.remove('!border-blue-600', 'bg-blue-50/50'); });
    });
    drop.addEventListener('drop', function (e) {
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      handleEvidenceFile(file);
    });

    // Directory search & filter
    $('#dirSearch').addEventListener('input', debounce(function (e) {
      state.dirSearch = e.target.value;
      state.records.page = 1;
      if (state.dirMode === 'records') renderRecords(); else renderStudents();
    }, 150));
    $('#dirFilter').addEventListener('change', function (e) {
      state.records.filter = e.target.value;
      state.records.page = 1;
      loadRecords(true);
    });

    // Conferences search & filter
    $('#confSearch').addEventListener('input', debounce(function (e) {
      state.conferences.search = e.target.value;
      renderConferences();
    }, 150));
    $('#confStatusFilter').addEventListener('change', function (e) {
      state.conferences.status = e.target.value;
      renderConferences();
    });

    // Audit search & filter
    $('#auditSearch').addEventListener('input', debounce(function (e) {
      state.audit.search = e.target.value;
      state.audit.page = 1;
      renderAudit();
    }, 200));
    $('#auditAction').addEventListener('change', function (e) {
      state.audit.action = e.target.value;
      state.audit.page = 1;
      renderAudit();
    });

    // Re-draw the trend chart when the window is resized
    window.addEventListener('resize', debounce(function () {
      if (state.view === 'dashboard' && state.dash.data) renderTrend(state.dash.data.trend);
    }, 200));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
