  function icon(name, cls) {
    var d = ICONS[name] || ICONS.info;
    return '<svg class="' + (cls || 'w-5 h-5') + ' shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';
  }

  /** Replaces [data-app-logo] placeholders with the school logo (falls back to a shield icon). */
  function hydrateLogos() {
    var url = typeof window.CS_LOGO_URL === 'string' ? window.CS_LOGO_URL : '';
    var hasLogo = /^data:image\//.test(url);
    $$('[data-app-logo]').forEach(function (el) {
      var size = el.getAttribute('data-app-logo') || 'h-9 w-9';
      el.outerHTML = hasLogo
        ? '<img src="' + esc(url) + '" alt="School logo" class="' + size + ' shrink-0 rounded-full object-contain">'
        : '<span class="flex ' + size + ' shrink-0 items-center justify-center rounded-xl bg-blue-600 text-white">' + icon('shield', 'w-1/2 h-1/2') + '</span>';
    });
  }

  function hydrateIcons(root) {
    $$('[data-icon]', root || document).forEach(function (el) {
      el.innerHTML = icon(el.getAttribute('data-icon'), el.getAttribute('data-icon-class') || 'w-5 h-5');
      el.removeAttribute('data-icon');
    });
  }

  // ==========================================================================
  // 3. HELPERS
  // ==========================================================================

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(value) {
    return String(value === undefined || value === null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function safeUrl(url) {
    var s = String(url || '').trim();
    return /^https?:\/\//i.test(s) ? s : '';
  }

  function fmtNum(n) { return Number(n || 0).toLocaleString(); }

  function ordinal(n) {
    var s = ['th', 'st', 'nd', 'rd'];
    var v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return 'A';
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }

  function debounce(fn, wait) {
    var t = null;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  function errMsg(err) {
    var msg = err && err.message ? err.message : String(err || 'Unknown error');
    return msg.replace(/^(Error|Exception|ScriptError):\s*/i, '').replace(/^AUTH_REQUIRED:\s*/, '');
  }

  function notifyError(err) {
    if (err && err.isAuth) return;
    toast(errMsg(err), 'error');
  }

  function fmtBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function isAdmin() { return !!(state.user && state.user.role === 'Admin'); }

  // ---- Demo mode helpers ----
  // This is the public demo build: visitors never see a sign-in page.
  var DEMO_BUILD = true;
  function isDemo() { return DEMO_BUILD || !!(state.publicConfig && state.publicConfig.demo); }
  function isVisitor() { return !!(state.boot && state.boot.demo && state.boot.demo.isVisitor); }
  function adminMode() { return window.DART_ADMIN_MODE === true; }
  function demoUrl(admin) {
    var base = String(window.DART_APP_URL || '');
    if (!base) return '#';
    return admin ? base + (base.indexOf('?') === -1 ? '?' : '&') + 'admin=1' : base;
  }

  /** Opens a password-less session (visitor, or owner when ?admin=1) and enters the app. */
  function startPublicSession(asVisitor) {
    return run('startPublicSession', asVisitor).then(function (res) {
      saveToken(res.token);
      return api('bootstrap');
    }).then(function (boot) {
      hideLoader();
      enterApp(boot);
      return boot;
    });
  }

  function applyDemo() {
    var demo = state.boot && state.boot.demo;
    var on = !!(demo && demo.enabled);
    var visitor = on && demo.isVisitor;
    var virtualUser = on && demo.isVirtual;
    var banner = $('#demoBanner');
    if (banner) {
      banner.hidden = !on;
      if (on) {
        banner.innerHTML = '<span class="shrink-0">' + icon('info', 'w-5 h-5') + '</span><div>' +
          (visitor
            ? '<p class="font-bold">Demo mode — sample data only</p>' +
              '<p class="mt-0.5">Every student, guardian and incident here is fictional. Feel free to try it: log an incident, edit a record, schedule a parent conference or generate a PDF report. ' +
              'Changes reset every night. Settings, user accounts, the audit log, deleting and photo uploads are reserved for the admin.</p>'
            : '<p class="font-bold">Demo mode — signed in as Admin</p>' +
              '<p class="mt-0.5">You have full access. Visitors see the same fictional data with admin pages and deletes locked. Data resets nightly' +
              (demo.lastReset ? ' (last reset ' + esc(new Date(demo.lastReset).toLocaleString()) + ')' : '') + '.</p>') +
          '</div>';
      }
    }
    var link = $('#adminSigninLink');
    if (link) { link.hidden = !visitor; link.setAttribute('href', demoUrl(true)); }
    var acct = $('#accountButtons');
    if (acct) acct.hidden = visitor;
    var pw = $('[data-action="change-password"]');
    if (pw) pw.hidden = virtualUser;
    var note = $('#evidenceDemoNote');
    var drop = $('#evidenceDrop');
    if (note) note.hidden = !visitor;
    if (drop) drop.hidden = visitor;
  }

  function filterLabel(key) {
    var f = state.timeFilters.filter(function (x) { return x.key === key; })[0];
    return f ? f.label : 'All Time';
  }

  /** Calls a public (no-session) server function. */
  function run(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('google.script.run is unavailable. Open the app through its deployed Web App URL.'));
        return;
      }
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err instanceof Error ? err : new Error(String(err && err.message ? err.message : err))); });
      runner[fnName].apply(runner, args);
    });
  }

  /** Calls a signed-in data action through the server's apiCall gateway. */
  function api(action) {
    var args = Array.prototype.slice.call(arguments, 1);
    return run('apiCall', state.token, action, args).catch(function (err) {
      var raw = err && err.message ? err.message : String(err);
      if (/AUTH_REQUIRED:/.test(raw)) {
        var e2 = new Error(raw.replace(/^.*AUTH_REQUIRED:\s*/, ''));
        e2.isAuth = true;
        handleSessionExpired(e2.message);
        throw e2;
      }
      throw err;
    });
  }

  function loadingBlock(text) {
    return '<div class="flex items-center justify-center gap-2 px-6 py-14 text-sm muted"><span class="spinner"></span>' + esc(text || 'Loading…') + '</div>';
  }

  function emptyBlock(title, sub, iconName) {
    return '<div class="flex flex-col items-center justify-center px-6 py-14 text-center">' +
      '<span class="mb-3 flex h-11 w-11 items-center justify-center rounded-full bg-slate-100 text-slate-400 dark:bg-neutral-800 dark:text-neutral-500">' + icon(iconName || 'search') + '</span>' +
      '<p class="text-sm font-semibold">' + esc(title) + '</p>' +
      (sub ? '<p class="mt-1 max-w-sm text-sm muted">' + esc(sub) + '</p>' : '') +
      '</div>';
  }

  function skeletonLines(n) {
    var out = '<div class="space-y-4">';
    for (var i = 0; i < n; i++) out += '<div class="skeleton h-6"></div>';
    return out + '</div>';
  }

  function severityBadge(severity) {
    var s = String(severity || '').toLowerCase();
    var cls = 'bg-blue-50 text-blue-700 ring-1 ring-inset ring-blue-600/20 dark:bg-blue-500/10 dark:text-blue-300 dark:ring-blue-400/30';
    if (/grave|severe|critical|serious/.test(s)) cls = 'bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-400/30';
    else if (/major|high/.test(s)) cls = 'bg-slate-900 text-white dark:bg-white dark:text-black';
    return '<span class="badge ' + cls + '">' + esc(severity || '—') + '</span>';
  }

  function frequencyBadge(freq) {
    var n = parseInt(String(freq || ''), 10);
    var cls = n >= state.threshold
      ? 'bg-red-600 text-white'
      : 'bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200';
    return '<span class="badge ' + cls + '">' + esc(freq || '—') + '</span>';
  }

  function statusBadge(status) {
    if (!status) return '';
    var s = String(status).toLowerCase();
    var cls = 'bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200';
    if (/pending|investigat|review|open/.test(s)) cls = 'bg-amber-50 text-amber-800 ring-1 ring-inset ring-amber-600/20 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-400/30';
    else if (/adjudicat|resolved|closed|settled|done|complete/.test(s)) cls = 'bg-blue-600 text-white';
    else if (/dismiss|cancel|void/.test(s)) cls = 'bg-slate-200 text-slate-600 line-through dark:bg-neutral-800 dark:text-neutral-400';
    return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
  }

  function conferenceBadge(status, dateDisplay) {
    if (!status) return '<span class="badge bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-400/30">None recorded</span>';
    var cls = 'bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200';
    if (status === 'Held') cls = 'bg-blue-600 text-white';
    else if (status === 'Scheduled' || status === 'Rescheduled') cls = 'bg-amber-50 text-amber-800 ring-1 ring-inset ring-amber-600/20 dark:bg-amber-500/10 dark:text-amber-300 dark:ring-amber-400/30';
    else if (status === 'No-show') cls = 'bg-red-50 text-red-700 ring-1 ring-inset ring-red-600/20 dark:bg-red-500/10 dark:text-red-300 dark:ring-red-400/30';
    return '<span class="badge ' + cls + '">' + esc(status) + (dateDisplay ? ' · ' + esc(dateDisplay) : '') + '</span>';
  }

  function roleBadge(role) {
    return role === 'Admin'
      ? '<span class="badge bg-blue-600 text-white">Admin</span>'
      : '<span class="badge bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200">Staff</span>';
  }

  function setBtnLoading(btn, on, text) {
    if (!btn) return;
    if (on) {
      if (!btn.dataset.original) btn.dataset.original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:.9rem;height:.9rem"></span>' + esc(text || 'Working…');
    } else {
      btn.disabled = false;
      if (btn.dataset.original) { btn.innerHTML = btn.dataset.original; delete btn.dataset.original; }
    }
  }

  function setRefreshing(key, on) {
    $$('[data-refresh="' + key + '"] svg').forEach(function (svg) { svg.classList.toggle('animate-spin', !!on); });
  }

  function triggerDownload(blob, fileName) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.target = '_self';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  function downloadFile(fileName, content, mimeType) {
    triggerDownload(new Blob([content], { type: (mimeType || 'text/plain') + ';charset=utf-8' }), fileName);
  }

  function downloadBase64(fileName, base64, mimeType) {
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    triggerDownload(new Blob([bytes], { type: mimeType || 'application/octet-stream' }), fileName);
  }

  function generatePassword() {
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz';
    var digits = '23456789';
    var all = chars + digits;
    var arr = new Uint32Array(10);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    var out = chars[arr[0] % chars.length] + digits[arr[1] % digits.length];
    for (var i = 2; i < 10; i++) out += all[arr[i] % all.length];
    return out.split('').sort(function () { return 0.5 - Math.random(); }).join('');
  }

  // ==========================================================================
  // 4. TOASTS & MODALS
  // ==========================================================================

  function toast(message, type, opts) {
    type = type || 'success';
    opts = opts || {};
    var border = { success: 'border-blue-600', error: 'border-red-600', warning: 'border-red-600', info: 'border-slate-400' }[type];
    var iconName = { success: 'check-circle', error: 'alert', warning: 'alert', info: 'info' }[type];
    var iconColor = { success: 'text-blue-600 dark:text-blue-400', error: 'text-red-600', warning: 'text-red-600', info: 'text-slate-500' }[type];
    var link = safeUrl(opts.linkUrl);
    var el = document.createElement('div');
    el.className = 'toast-enter pointer-events-auto flex w-full gap-3 rounded-xl border-l-4 ' + border + ' bg-white p-4 shadow-lg ring-1 ring-black/5 dark:bg-neutral-900 dark:ring-white/10';
    el.innerHTML =
      '<span class="' + iconColor + '">' + icon(iconName) + '</span>' +
      '<div class="min-w-0 flex-1 text-sm">' +
        '<p class="break-words font-medium text-slate-900 dark:text-white">' + esc(message) + '</p>' +
        (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener" class="mt-1 inline-flex items-center gap-1 font-semibold text-blue-600 hover:underline dark:text-blue-400">' + esc(opts.linkText || 'Open') + icon('external', 'w-3.5 h-3.5') + '</a>' : '') +
      '</div>' +
      '<button type="button" class="shrink-0 text-slate-400 hover:text-slate-900 dark:hover:text-white" aria-label="Dismiss">' + icon('x', 'w-4 h-4') + '</button>';
    el.querySelector('button').addEventListener('click', function () { el.remove(); });
    var wrap = $('#toastWrap');
    while (wrap.children.length >= 3) wrap.removeChild(wrap.firstChild);
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, opts.duration || (type === 'error' || type === 'warning' ? 8000 : 5000));
  }

  function openModal(opts) {
    if (state.modalResolve) { var r = state.modalResolve; state.modalResolve = null; r(false); }
    var root = $('#modalRoot');
    root.innerHTML =
      '<div class="fixed inset-0 z-[105] flex items-end justify-center sm:items-center sm:p-4">' +
        '<div class="absolute inset-0 bg-black/60" data-action="modal-close"></div>' +
        '<div role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '" class="relative flex max-h-[92vh] w-full ' + (opts.size || 'max-w-lg') + ' flex-col rounded-t-2xl border border-slate-200 bg-white shadow-2xl sm:rounded-2xl dark:border-neutral-800 dark:bg-neutral-900">' +
          '<div class="flex items-center justify-between gap-4 border-b border-slate-200 px-5 py-4 dark:border-neutral-800">' +
            '<h3 class="text-base font-semibold text-slate-900 dark:text-white">' + esc(opts.title) + '</h3>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-action="modal-close" aria-label="Close">' + icon('x') + '</button>' +
          '</div>' +
          '<div class="modal-body scrollbar-thin overflow-y-auto px-5 py-5">' + (opts.body || '') + '</div>' +
          (opts.footer ? '<div class="modal-footer flex flex-col-reverse gap-2 border-t border-slate-200 px-5 py-4 sm:flex-row sm:justify-end dark:border-neutral-800">' + opts.footer + '</div>' : '') +
        '</div>' +
      '</div>';
    root.hidden = false;
    document.body.classList.add('overflow-hidden');
    hydrateIcons(root);
    var first = root.querySelector('.modal-body input:not([disabled]):not([type="checkbox"]), .modal-body select, .modal-body textarea');
    if (first) setTimeout(function () { first.focus(); }, 60);
    return root;
  }

  function isModalOpen() { return !$('#modalRoot').hidden; }

  function closeModal() {
    var root = $('#modalRoot');
    root.hidden = true;
    root.innerHTML = '';
    if ($('#authScreen').hidden) document.body.classList.remove('overflow-hidden');
    if (state.modalResolve) { var r = state.modalResolve; state.modalResolve = null; r(false); }
  }

  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      openModal({
        title: opts.title,
        size: 'max-w-md',
        body: '<p class="text-sm text-slate-600 dark:text-neutral-300">' + esc(opts.message) + '</p>',
        footer: '<button type="button" class="btn btn-secondary" data-action="modal-close">Cancel</button>' +
                '<button type="button" id="confirmOk" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '">' + esc(opts.confirmText || 'Confirm') + '</button>'
      });
      state.modalResolve = resolve;
      $('#confirmOk').addEventListener('click', function () {
        state.modalResolve = null;
        closeModal();
        resolve(true);
      });
    });
  }

  function openPrivacyNotice() {
    openModal({
      title: 'Data Privacy Notice',
      size: 'max-w-2xl',
      body:
        '<div class="mb-4 flex items-center gap-3 rounded-xl bg-blue-50 p-3 text-sm font-semibold text-blue-900 dark:bg-blue-500/10 dark:text-blue-100">' + icon('shield', 'w-5 h-5') +
          'Republic Act No. 10173 — Data Privacy Act of 2012</div>' +
        '<ol class="list-decimal space-y-3 pl-5 text-sm leading-relaxed text-slate-700 dark:text-neutral-300">' +
          (state.privacy || DEFAULT_PRIVACY).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') +
        '</ol>',
      footer: '<button type="button" class="btn btn-primary" data-action="modal-close">I understand</button>'
    });
  }

  // ==========================================================================
  // 5. THEME, SIDEBAR, NAVIGATION
  // ==========================================================================

  function isDark() { return document.documentElement.classList.contains('dark'); }

  function renderThemeToggles() {
    $$('.theme-toggle').forEach(function (btn) {
      btn.innerHTML = icon(isDark() ? 'sun' : 'moon', 'w-5 h-5');
      btn.title = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
    });
  }

  function toggleTheme() {
    var dark = !isDark();
    document.documentElement.classList.toggle('dark', dark);
    try { window.localStorage.setItem('dart-theme', dark ? 'dark' : 'light'); } catch (e) { /* storage unavailable */ }
    renderThemeToggles();
    if (state.view === 'dashboard' && state.dash.data) renderTrend(state.dash.data.trend);
  }

  function openSidebar() {
    $('#sidebar').classList.remove('-translate-x-full');
    $('#sidebarBackdrop').hidden = false;
  }

  function closeSidebar() {
    $('#sidebar').classList.add('-translate-x-full');
    $('#sidebarBackdrop').hidden = true;
  }

  function showView(name) {
    if (!VIEW_TITLES[name]) name = 'dashboard';
    if (ADMIN_VIEWS.indexOf(name) !== -1 && !isAdmin()) {
      toast('That page is only available to Admin accounts.', 'info');
      name = 'dashboard';
    }
    state.view = name;
    $$('[data-view]').forEach(function (s) { s.hidden = s.getAttribute('data-view') !== name; });
    $$('#sidebar [data-nav]').forEach(function (b) {
      var on = b.getAttribute('data-nav') === name;
      b.classList.toggle('active', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    document.title = VIEW_TITLES[name] + ' · DART';
    closeSidebar();
    window.scrollTo(0, 0);

    if (name === 'dashboard') loadDashboard(false);
    if (name === 'directory') { if (state.dirMode === 'records') loadRecords(false); else loadStudents(false); }
    if (name === 'watchlist') loadWatchlist(false);
    if (name === 'conferences') loadConferences(false);
    if (name === 'config') loadConfig(false);
    if (name === 'users') loadUsers(false);
    if (name === 'audit') loadAudit(false);
    if (name === 'log') populateFormSelects();
  }

  /** Marks cached views as stale after data changes. */
  function markDirty(opts) {
    opts = opts || {};
    state.dash.loaded = false;
    state.students.loaded = false;
    state.watchlist.loaded = false;
    state.audit.loaded = false;
    if (!opts.keepRecords) state.records.loaded = false;
    if (!opts.keepConferences) state.conferences.loaded = false;
  }

  function applyRole() {
    var admin = isAdmin();
    $$('[data-admin-only]').forEach(function (el) { el.hidden = !admin; });
  }

  // ==========================================================================
  // 6. AUTHENTICATION
  // ==========================================================================

  function saveToken(token) {
    state.token = token || '';
    try {
      if (token) window.sessionStorage.setItem(TOKEN_KEY, token);
      else window.sessionStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* storage unavailable: token stays in memory only */ }
  }

  function readToken() {
    try { return window.sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }

  function setAuthError(msg) {
    var box = $('#authError');
    if (!msg) { box.hidden = true; box.innerHTML = ''; return; }
    box.innerHTML = '<span class="shrink-0">' + icon('alert', 'w-4 h-4') + '</span><span>' + esc(msg) + '</span>';
    box.hidden = false;
  }

  function showAuth(mode, message) {
    $('#authScreen').hidden = false;
    document.body.classList.add('overflow-hidden');
    $('#loginForm').hidden = mode !== 'login';
    $('#setupForm').hidden = mode !== 'setup';
    setAuthError(message || '');
    var first = mode === 'setup' ? $('#setupKey') : $('#loginUser');
    setTimeout(function () { if (first) first.focus(); }, 80);
  }

  function hideAuth() {
    $('#authScreen').hidden = true;
    document.body.classList.remove('overflow-hidden');
    setAuthError('');
    $('#loginPass').value = '';
    $('#setupPass').value = '';
    $('#setupConfirm').value = '';
  }

  function submitLogin() {
    var u = $('#loginUser').value.trim();
    var p = $('#loginPass').value;
    if (!u || !p) { setAuthError('Enter your username and password.'); return; }
    var btn = $('#loginBtn');
    setBtnLoading(btn, true, 'Signing in…');
    setAuthError('');
    run('login', u, p).then(function (res) {
      saveToken(res.token);
      return api('bootstrap');
    }).then(enterApp).catch(function (err) {
      setAuthError(errMsg(err));
      $('#loginPass').value = '';
      $('#loginPass').focus();
    }).then(function () { setBtnLoading(btn, false); });
  }

  function submitSetup() {
    var key = $('#setupKey').value.trim();
    var name = $('#setupName').value.trim() || 'ADMIN';
    var u = $('#setupUser').value.trim();
    var p = $('#setupPass').value;
    var c = $('#setupConfirm').value;
    if (!key) { setAuthError('Enter the setup key from the setupDatabase() Execution log.'); $('#setupKey').focus(); return; }
    if (!u || !p) { setAuthError('Username and password are required.'); return; }
    if (p !== c) { setAuthError('The passwords do not match.'); return; }
    var btn = $('#setupBtn');
    setBtnLoading(btn, true, 'Creating account…');
    setAuthError('');
    run('createFirstAdmin', { setup_key: key, display_name: name, username: u, password: p }).then(function (res) {
      saveToken(res.token);
      return api('bootstrap');
    }).then(function (boot) {
      enterApp(boot);
      toast('Admin account created. Welcome to DART!', 'success');
    }).catch(function (err) {
      setAuthError(errMsg(err));
    }).then(function () { setBtnLoading(btn, false); });
  }

  function resetAppState() {
    state.user = null;
    state.boot = null;
    state.dash = { filter: 'ALL', data: null, loaded: false, seq: state.dash.seq + 1 };
    state.records = { filter: 'ALL', items: [], loaded: false, page: 1, seq: state.records.seq + 1 };
    state.students = { items: [], loaded: false, seq: state.students.seq + 1 };
    state.watchlist = { items: [], loaded: false, seq: state.watchlist.seq + 1 };
    state.conferences = { items: [], loaded: false, seq: state.conferences.seq + 1, search: '', status: '' };
    state.users = { items: [], loaded: false };
    state.audit = { items: [], loaded: false, page: 1, search: '', action: '' };
    state.config = { loaded: false, editing: null, busy: {} };
    state.lastSaved = null;
    state.reportBusy = {};
    state.evidence = null;
    state.autofill = { name: false, section: false };
    ['#dashCards', '#trendChart', '#dashGrades', '#dashSections', '#dashSanctions', '#dashInfractions', '#dashRemarks', '#dashSeverity', '#dashRecent',
      '#recordsWrap', '#studentsWrap', '#watchlistWrap', '#conferencesWrap', '#configGrid', '#calendarCard', '#usersWrap', '#auditWrap'].forEach(function (id) {
      var el = $(id);
      if (el) el.innerHTML = '';
    });
    $('#lastSavedCard').hidden = true;
    $('#summaryResult').hidden = true;
    $('#exportResult').hidden = true;
    $('#dirSearch').value = '';
    $('#confSearch').value = '';
    $('#auditSearch').value = '';
    state.dirSearch = '';
    if (isModalOpen()) closeModal();
  }

  function logout() {
    var token = state.token;
    saveToken('');
    resetAppState();
    if (token) run('logout', token).catch(function () { /* ignore */ });
    if (isDemo()) {
      startPublicSession(true).catch(function (err) { showView('dashboard'); showFatal(errMsg(err)); });
      return;
    }
    showAuth('login');
  }

  function handleSessionExpired(message) {
    if (!$('#authScreen').hidden) return;
    if (isDemo() && !state.boot) return;   // still starting up: init() opens a fresh demo session itself
    var wasVisitor = isVisitor();
    saveToken('');
    resetAppState();
    if (isDemo() && (wasVisitor || !adminMode())) {
      startPublicSession(true).then(function () { toast('Your demo session was refreshed.', 'info'); })
        .catch(function (err) { showView('dashboard'); showFatal(errMsg(err)); });
      return;
    }
    showAuth('login', message || 'Your session has expired. Please sign in again.');
  }

  function enterApp(boot) {
    state.boot = boot;
    state.user = boot.user;
    state.threshold = boot.escalationThreshold || 3;
    if (boot.timeFilters && boot.timeFilters.length) state.timeFilters = boot.timeFilters;
    if (boot.privacyNotice && boot.privacyNotice.length) state.privacy = boot.privacyNotice;
    if (boot.conferenceStatuses && boot.conferenceStatuses.length) CONFERENCE_STATUSES = boot.conferenceStatuses;
    state.calendar = boot.calendar || null;
    state.settingsAll = flattenGrouped(boot.settings);
    $('#thresholdLabel').textContent = state.threshold;
    renderProfile(boot.user);
    applyRole();
    applyDemo();
    renderTimeFilterControls();
    renderStaticFilters();
    populateFormSelects();
    hideAuth();
    showView('dashboard');
  }

  // ==========================================================================
  // 7. BOOTSTRAP
  // ==========================================================================

  function renderProfile(user) {
    $('#profileName').textContent = (user && user.display_name) || 'ADMIN';
    $('#profileRole').textContent = (user && user.role ? user.role : 'Admin') + (user && user.username ? ' · @' + user.username : '');
  }

  function timeOptions(selected) {
    return state.timeFilters.map(function (f) {
      return '<option value="' + esc(f.key) + '"' + (f.key === selected ? ' selected' : '') + '>' + esc(f.label) + '</option>';
    }).join('');
  }

  function renderTimeFilterControls() {
    $('#dashFilters').innerHTML = state.timeFilters.map(function (f) {
      var on = f.key === state.dash.filter;
      return '<button type="button" role="tab" aria-selected="' + on + '" class="seg-btn' + (on ? ' active' : '') + '" data-action="dash-filter" data-filter="' + esc(f.key) + '">' + esc(f.label) + '</button>';
    }).join('');
    $('#dirFilter').innerHTML = timeOptions(state.records.filter);
    var exp = $('#exportFilter').value || 'ALL';
    $('#exportFilter').innerHTML = timeOptions(exp);
    var sum = $('#summaryFilter').value || 'ACADEMIC_YEAR';
    $('#summaryFilter').innerHTML = timeOptions(sum);
  }

  function renderStaticFilters() {
    $('#confStatusFilter').innerHTML = '<option value="">All statuses</option>' +
      CONFERENCE_STATUSES.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('');
    $('#auditAction').innerHTML = '<option value="">All actions</option>' +
      AUDIT_ACTIONS.map(function (a) { return '<option value="' + esc(a) + '">' + esc(a.replace(/_/g, ' ')) + '</option>'; }).join('');
  }

  function flattenGrouped(grouped) {
    var list = [];
    Object.keys(grouped || {}).forEach(function (cat) {
      (grouped[cat] || []).forEach(function (s) { list.push(s); });
    });
    return list;
  }

  function showFatal(message) {
    var box = $('#fatalError');
    box.innerHTML =
      '<div class="flex gap-3 rounded-2xl border border-red-200 bg-red-50 p-5 text-red-800 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200">' +
        '<span class="shrink-0 text-red-600">' + icon('alert') + '</span>' +
        '<div class="text-sm"><p class="font-bold">DART could not start.</p><p class="mt-1">' + esc(message) + '</p>' +
        '<p class="mt-2 text-red-700/80 dark:text-red-300/80">If this is a first deployment, run <code class="rounded bg-red-100 px-1 dark:bg-red-500/20">setupDemo()</code> once from the Apps Script editor, deploy a new version, then reload.</p></div>' +
      '</div>';
    box.hidden = false;
  }

  function hideLoader() {
    var l = $('#appLoader');
    if (l) l.remove();
  }

  function init() {
    hydrateLogos();
    hydrateIcons(document);
    renderThemeToggles();
    renderTimeFilterControls();
    renderStaticFilters();
    $('#exportColumns').innerHTML = LOG_COLUMNS.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');
    bindEvents();
    renderOffensePanel(null);

    run('getPublicConfig').then(function (cfg) {
      state.publicConfig = cfg;
      if (cfg.privacyNotice && cfg.privacyNotice.length) state.privacy = cfg.privacyNotice;
      var back = $('#backToDemo');
      if (back) back.setAttribute('href', demoUrl(false));

      if (isDemo()) {
        // DEMO: no sign-in page for visitors.
        var savedDemo = readToken();
        if (adminMode()) {
          // ?admin=1 -> owner's Google account is Admin automatically, otherwise password sign-in.
          var tryOwner = savedDemo
            ? api('bootstrap').then(function (boot) {
                if (boot.user && boot.user.role === 'Admin') { hideLoader(); enterApp(boot); return true; }
                return false;
              }).catch(function () { return false; })
            : Promise.resolve(false);
          return tryOwner.then(function (done) {
            if (done) return null;
            return run('startPublicSession', false).then(function (res) {
              if (res.mode === 'owner') {
                saveToken(res.token);
                return api('bootstrap').then(function (boot) { hideLoader(); enterApp(boot); });
              }
              saveToken('');
              hideLoader();
              showAuth('login');
              return null;
            });
          });
        }
        if (savedDemo) {
          state.token = savedDemo;
          return api('bootstrap').then(function (boot) { hideLoader(); enterApp(boot); })
            .catch(function () { saveToken(''); return startPublicSession(true); });
        }
        return startPublicSession(true);
      }

      if (cfg.needsSetup) {
        hideLoader();
        showAuth('setup');
        return null;
      }
      var saved = readToken();
      if (!saved) {
        hideLoader();
        showAuth('login');
        return null;
      }
      state.token = saved;
      return api('bootstrap').then(function (boot) {
        hideLoader();
        enterApp(boot);
      }).catch(function (err) {
        hideLoader();
        if (!err.isAuth) showAuth('login', errMsg(err));
      });
    }).catch(function (err) {
      hideLoader();
      showView('dashboard');
      showFatal(errMsg(err));
    });
  }

  // ==========================================================================
  // 8. DASHBOARD
  // ==========================================================================

  function loadDashboard(force) {
    var d = state.dash;
    if (d.loaded && !force) { renderDashboard(); return; }
    var seq = ++d.seq;
    if (!d.data) renderDashboardSkeleton();
    setRefreshing('dashboard', true);
    api('getDashboardStats', d.filter).then(function (data) {
      if (seq !== d.seq) return;
      d.data = data;
      d.loaded = true;
      renderDashboard();
    }).catch(function (err) {
      if (seq !== d.seq) return;
      notifyError(err);
      if (!d.data && !err.isAuth) $('#dashCards').innerHTML = '<div class="card sm:col-span-2 xl:col-span-4">' + emptyBlock('Dashboard unavailable', errMsg(err), 'alert') + '</div>';
    }).then(function () {
      if (seq === d.seq) setRefreshing('dashboard', false);
    });
  }

  function renderDashboardSkeleton() {
    var card = '<div class="card card-pad"><div class="skeleton mb-4 h-4 w-24"></div><div class="skeleton mb-2 h-8 w-20"></div><div class="skeleton h-3 w-32"></div></div>';
    $('#dashCards').innerHTML = card + card + card + card;
    $('#trendChart').innerHTML = '<div class="skeleton h-[220px]"></div>';
    ['#dashGrades', '#dashSections', '#dashSanctions', '#dashInfractions', '#dashRemarks', '#dashSeverity'].forEach(function (id) { $(id).innerHTML = skeletonLines(4); });
    $('#dashRecent').innerHTML = '<div class="p-6">' + skeletonLines(5) + '</div>';
  }

  function barList(items, key, emptyText) {
    if (!items || !items.length) return '<p class="py-6 text-center text-sm muted">' + esc(emptyText || 'No data for this period.') + '</p>';
    var max = Math.max.apply(null, items.map(function (i) { return i.count; }));
    var total = items.reduce(function (s, i) { return s + i.count; }, 0);
    return '<ul class="space-y-3.5">' + items.slice(0, 8).map(function (i) {
      var pct = total ? Math.round(i.count / total * 100) : 0;
      var width = max ? Math.max(4, Math.round(i.count / max * 100)) : 0;
      return '<li>' +
        '<div class="mb-1.5 flex items-baseline justify-between gap-3 text-sm">' +
          '<span class="truncate font-medium" title="' + esc(i[key]) + '">' + esc(i[key]) + '</span>' +
          '<span class="shrink-0 tabular-nums muted"><b class="text-slate-900 dark:text-white">' + fmtNum(i.count) + '</b> · ' + pct + '%</span>' +
        '</div>' +
        '<div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-neutral-800"><div class="h-full rounded-full bg-blue-600" style="width:' + width + '%"></div></div>' +
      '</li>';
    }).join('') + '</ul>' + (items.length > 8 ? '<p class="mt-3 text-xs muted">+ ' + (items.length - 8) + ' more</p>' : '');
  }

  function renderDashboard() {
    var data = state.dash.data;
    if (!data) return;
    renderTimeFilterControls();
    $('#dashRangeLabel').textContent = 'Showing: ' + (data.filter_label || 'All Time') + (data.range_text && data.filter !== 'ALL' ? ' · ' + data.range_text : '');
    updateWatchlistBadge(data.escalated_students);

    var top = (data.sanctions_summary || [])[0];
    var cards = [
      { label: 'Total Infractions', value: fmtNum(data.total_infractions), sub: data.filter_label, icon: 'file-text', accent: true },
      { label: 'Students Involved', value: fmtNum(data.unique_students), sub: 'Unique student IDs in this period', icon: 'users' },
      { label: 'Escalation Watchlist', value: fmtNum(data.escalated_students), sub: data.pending_conferences + ' still need a held parent conference', icon: 'alert', warn: data.pending_conferences > 0, nav: 'watchlist' },
      { label: 'Top Sanction', value: top ? top.sanction : '—', sub: top ? fmtNum(top.count) + ' issued in this period' : 'No sanctions yet', icon: 'clipboard', small: true }
    ];
    $('#dashCards').innerHTML = cards.map(function (c) {
      var boxCls = c.accent ? 'bg-white/15 text-white' : (c.warn ? 'bg-red-50 text-red-600 dark:bg-red-500/10 dark:text-red-400' : 'bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400');
      var tag = c.nav ? 'button type="button" data-nav="' + c.nav + '"' : 'div';
      var close = c.nav ? 'button' : 'div';
      return '<' + tag + ' class="card card-pad text-left ' + (c.accent ? '!border-blue-600 !bg-blue-600 text-white' : '') + (c.nav ? ' transition hover:border-blue-400 dark:hover:border-blue-500' : '') + '">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<p class="text-sm font-medium ' + (c.accent ? 'text-blue-100' : 'muted') + '">' + esc(c.label) + '</p>' +

  /** Single-series bar chart: incidents per hour/day/month, with hover tooltips. */
  function renderTrend(trend) {
    var wrap = $('#trendChart');
    var pts = (trend && trend.points) || [];
    var unitWord = trend && trend.unit === 'month' ? 'month' : (trend && trend.unit === 'day' ? 'day' : 'hour');
    var total = pts.reduce(function (s, p) { return s + p.count; }, 0);
    if (!pts.length) {
      $('#trendSub').textContent = 'No data';
      wrap.innerHTML = emptyBlock('No data for this period', '', 'trending-up');
      return;
    }
    var peak = pts.reduce(function (a, p) { return p.count > a.count ? p : a; }, pts[0]);
    $('#trendSub').textContent = fmtNum(total) + ' incident' + (total === 1 ? '' : 's') + ' · per ' + unitWord + (peak.count ? ' · Peak: ' + peak.label + ' (' + peak.count + ')' : '');

    var W = Math.max(wrap.clientWidth || 640, 280);
    var H = 220, padL = 34, padR = 8, padT = 10, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var max = Math.max.apply(null, pts.map(function (p) { return p.count; }));
    var step = Math.max(1, Math.ceil(max / 4));
    var niceMax = step * 4;
    var n = pts.length;
    var slot = plotW / n;
    var barW = Math.max(2, Math.min(slot - 2, 40));
    var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Incidents per ' + unitWord + ', ' + total + ' total">';

    for (var k = 0; k <= 4; k++) {
      var val = k * step;
      var yy = padT + plotH - (val / niceMax) * plotH;
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '" class="' + (k === 0 ? 'stroke-slate-300 dark:stroke-neutral-700' : 'stroke-slate-200 dark:stroke-neutral-800') + '" stroke-width="1"' + (k === 0 ? '' : ' stroke-dasharray="3 3"') + '/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" class="fill-slate-500 dark:fill-neutral-400">' + val + '</text>';
    }

    var maxLabels = Math.max(2, Math.floor(plotW / 64));
    var every = Math.ceil(n / maxLabels);
    pts.forEach(function (p, i) {
      var x = padL + i * slot + (slot - barW) / 2;
      var h = niceMax ? (p.count / niceMax) * plotH : 0;
      var y = padT + plotH - h;
      if (h > 0) {
        var r = Math.min(4, barW / 2, h);
        var d = 'M' + x + ',' + (y + h) + ' L' + x + ',' + (y + r) + ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
          ' L' + (x + barW - r) + ',' + y + ' Q' + (x + barW) + ',' + y + ' ' + (x + barW) + ',' + (y + r) + ' L' + (x + barW) + ',' + (y + h) + ' Z';
        svg += '<path d="' + d + '" data-bar="' + i + '" class="fill-blue-600 dark:fill-blue-500 transition-opacity"/>';
      }
      if (i % every === 0) {
        svg += '<text x="' + (padL + i * slot + slot / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" class="fill-slate-500 dark:fill-neutral-400">' + esc(p.label) + '</text>';
      }
      svg += '<rect x="' + (padL + i * slot) + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" fill="transparent" data-hit="' + i + '" style="cursor:default"/>';
    });
    svg += '</svg>';

    var table = '<table class="sr-only"><caption>Incidents per ' + unitWord + '</caption><tr><th>Period</th><th>Incidents</th></tr>' +
      pts.map(function (p) { return '<tr><td>' + esc(p.label) + '</td><td>' + p.count + '</td></tr>'; }).join('') + '</table>';

    wrap.innerHTML = '<div class="overflow-hidden">' + svg + '</div>' + table +
      '<div id="trendTip" class="pointer-events-none absolute z-10 hidden rounded-lg bg-slate-900 px-2.5 py-1.5 text-xs text-white shadow-lg dark:bg-white dark:text-black"></div>';

    var tip = $('#trendTip');
    var showTip = function (i, evtX) {
      var p = pts[i];
      if (!p) return;
      $$('#trendChart [data-bar]').forEach(function (b) { b.style.opacity = b.getAttribute('data-bar') === String(i) ? '1' : '0.45'; });
      tip.innerHTML = '<div class="font-semibold">' + esc(p.label) + '</div><div>' + p.count + ' incident' + (p.count === 1 ? '' : 's') + '</div>';
      tip.classList.remove('hidden');
      var cx = padL + i * slot + slot / 2;
      var left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), W - tip.offsetWidth);
      tip.style.left = left + 'px';
      tip.style.top = '-6px';
    };
    var hideTip = function () {
      tip.classList.add('hidden');
      $$('#trendChart [data-bar]').forEach(function (b) { b.style.opacity = '1'; });
    };
    $$('#trendChart [data-hit]').forEach(function (rect) {
      rect.addEventListener('mouseenter', function () { showTip(parseInt(rect.getAttribute('data-hit'), 10)); });
      rect.addEventListener('click', function () { showTip(parseInt(rect.getAttribute('data-hit'), 10)); });
    });
    wrap.querySelector('svg').addEventListener('mouseleave', hideTip);
  }

  var debouncedCheckOffense = debounce(checkOffense, 450);

  /**
   * Runs whenever the Student ID is edited.
   * - ID cleared: Name and Section are cleared too.
   * - ID changed: Name/Section that came from a previous lookup are cleared,
   *   so the next lookup can fill in the correct student. Values typed by hand are kept.
   */
  function onStudentIdInput() {
    var sid = $('#f_student_id').value.trim();
    var nameEl = $('#f_student_name');
    var secEl = $('#f_section');
    if (!sid) {
      nameEl.value = '';
      secEl.value = '';
      state.autofill.name = false;
      state.autofill.section = false;
    } else {
      if (state.autofill.name) { nameEl.value = ''; state.autofill.name = false; }
      if (state.autofill.section) { secEl.value = ''; state.autofill.section = false; }
    }
    setInvalid(nameEl, false);
    setInvalid(secEl, false);
    $('#autofillHint').hidden = true;
    if (!sid) checkOffense();
    else debouncedCheckOffense();
  }

  function checkOffense() {
    var sid = $('#f_student_id').value.trim();
    var inf = $('#f_infraction').value;
    var seq = ++state.freq.seq;
    if (!sid) {
      state.freq.result = null;
      renderOffensePanel(null);
      return;
    }
    renderOffensePanel('loading');
    api('calculateFrequency', sid, inf).then(function (r) {
      if (seq !== state.freq.seq) return;
      if ($('#f_student_id').value.trim() !== sid) return;
      state.freq.result = r;
      if (r.known_student) {
        var filled = false;
        var nameEl = $('#f_student_name');
        var secEl = $('#f_section');
        if ((!nameEl.value.trim() || state.autofill.name) && r.known_student.student_name) {
          nameEl.value = r.known_student.student_name;
          state.autofill.name = true;
          setInvalid(nameEl, false);
          filled = true;
        }
        if ((!secEl.value.trim() || state.autofill.section) && r.known_student.section) {
          secEl.value = r.known_student.section;
          state.autofill.section = true;
          setInvalid(secEl, false);
          filled = true;
        }
        if (filled) $('#autofillHint').hidden = false;
      }
      renderOffensePanel(r);
    }).catch(function (err) {
      if (seq !== state.freq.seq || err.isAuth) return;
      renderOffensePanel({ error: errMsg(err) });
    });
  }

          : '<span class="badge bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200">Returning student</span>') +
        (r.escalation_triggered ? '<span class="badge bg-red-600 text-white">Escalation</span>' : '') +

  function setInvalid(el, bad) {
    if (!el) return;
    el.classList.toggle('!border-red-500', !!bad);

  }

  // ---------- Evidence upload ----------

  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error('Could not read the selected file.')); };
      reader.readAsDataURL(file);
    });
  }

  function compressImage(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1600;
          var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve({
            dataUrl: canvas.toDataURL('image/jpeg', 0.85),
            mimeType: 'image/jpeg',
            fileName: file.name.replace(/\.[^.]+$/, '') + '.jpg'
          });
        } catch (e) {
          URL.revokeObjectURL(url);
          resolve(null);
        }
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function dataUrlBytes(dataUrl) {
    var idx = dataUrl.indexOf(',');
    return Math.round((dataUrl.length - idx - 1) * 3 / 4);
  }

  function handleEvidenceFile(file) {
    if (!file) return;
    if (isVisitor()) { toast('Demo mode: photo uploads are turned off. Paste an evidence link instead.', 'error'); return; }
    var type = String(file.type || '').toLowerCase();
    if (!type && /\.(heic|heif)$/i.test(file.name)) type = 'image/heic';
    if (ALLOWED_TYPES.indexOf(type) === -1) {
      toast('Unsupported file type. Upload a JPG, PNG, GIF, WEBP, HEIC image or a PDF.', 'error');
      $('#f_evidence_file').value = '';
      return;
    }
    var compressible = COMPRESSIBLE_TYPES.indexOf(type) !== -1;
    if (file.size > MAX_UPLOAD_BYTES && !compressible) {
      toast('File exceeds the 10 MB limit.', 'error');
      $('#f_evidence_file').value = '';
      return;
    }

    var preview = $('#evidencePreview');
    preview.hidden = false;
    preview.innerHTML = '<div class="mt-3 flex items-center gap-2 text-sm muted"><span class="spinner"></span>Preparing file…</div>';
    $('#evidenceDrop').hidden = true;

    var work = (compressible && file.size > COMPRESS_OVER_BYTES) ? compressImage(file) : Promise.resolve(null);
    work.then(function (compressed) {
      if (compressed) return compressed;
      if (file.size > MAX_UPLOAD_BYTES) throw new Error('File exceeds the 10 MB limit.');
      return readAsDataUrl(file).then(function (dataUrl) {
        return { dataUrl: dataUrl, mimeType: type, fileName: file.name };
      });
    }).then(function (res) {
      state.evidence = {
        base64: res.dataUrl,
        mimeType: res.mimeType,
        fileName: res.fileName,
        size: dataUrlBytes(res.dataUrl),
        originalSize: file.size,
        previewable: /^image\/(jpeg|jpg|png|gif|webp)$/.test(res.mimeType)
      };
      renderEvidencePreview();
    }).catch(function (err) {
      toast(errMsg(err), 'error');
      clearEvidence();
    });
  }

  function renderEvidencePreview() {
    var ev = state.evidence;
    var preview = $('#evidencePreview');
    var linkInput = $('#f_evidence_link');
    if (!ev) {
      preview.hidden = true;
      preview.innerHTML = '';
      $('#evidenceDrop').hidden = false;
      linkInput.disabled = false;
      return;
    }
    var thumb = ev.previewable
      ? '<img src="' + esc(ev.base64) + '" alt="Evidence preview" class="h-16 w-16 shrink-0 rounded-lg object-cover ring-1 ring-black/10 dark:ring-white/10">'
      : '<span class="flex h-16 w-16 shrink-0 items-center justify-center rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">' + icon(ev.mimeType === 'application/pdf' ? 'file-text' : 'image', 'w-7 h-7') + '</span>';
    var sizeText = fmtBytes(ev.size) + (ev.originalSize > ev.size * 1.2 ? ' (compressed from ' + fmtBytes(ev.originalSize) + ')' : '');
    preview.hidden = false;
    preview.innerHTML =
      '<div class="flex items-center gap-4 rounded-xl border border-slate-200 p-3 dark:border-neutral-800">' + thumb +
        '<div class="min-w-0 flex-1"><p class="truncate text-sm font-semibold">' + esc(ev.fileName) + '</p><p class="text-xs muted">' + esc(sizeText) + ' · uploads to Google Drive on save</p></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="remove-evidence" title="Remove file">' + icon('trash', 'w-4 h-4') + '</button>' +
      '</div>';
    $('#evidenceDrop').hidden = true;
    linkInput.value = '';
    linkInput.disabled = true;
    setInvalid(linkInput, false);
  }

  function clearEvidence() {
    state.evidence = null;
    $('#f_evidence_file').value = '';
    renderEvidencePreview();
  }

  // ---------- Submit ----------

  function submitLog() {
    if (state.submitting) return;
    var required = ['student_id', 'student_name', 'section', 'infraction', 'severity', 'sanction'];
    var firstInvalid = null;
    required.forEach(function (k) {
      var el = $('#f_' + k);
      var bad = !el.value.trim();
      setInvalid(el, bad);
      if (bad && !firstInvalid) firstInvalid = el;
    });
    var linkEl = $('#f_evidence_link');
    var link = linkEl.value.trim();
    if (!state.evidence && link && !/^https?:\/\//i.test(link)) {
      setInvalid(linkEl, true);
      if (!firstInvalid) firstInvalid = linkEl;
    }
    if (firstInvalid) {
      firstInvalid.focus();
      toast('Please complete the required fields.', 'error');
      return;
    }

    var payload = {
      student_id: $('#f_student_id').value.trim(),
      student_name: $('#f_student_name').value.trim(),
      section: $('#f_section').value.trim(),
      infraction: $('#f_infraction').value,
      severity: $('#f_severity').value,
      sanction: $('#f_sanction').value,
      remarks: $('#f_remarks').value.trim(),
      remark_status: $('#f_remark_status').value,
      evidence_link: state.evidence ? '' : link
    };
    if (state.evidence) {
      payload.evidence_file = { base64: state.evidence.base64, mimeType: state.evidence.mimeType, fileName: state.evidence.fileName };
    }

    state.submitting = true;
    var btn = $('#logSubmit');
    setBtnLoading(btn, true, state.evidence ? 'Uploading evidence…' : 'Saving…');

    api('insertViolation', payload).then(function (res) {
      markDirty();
      toast(res.message || 'Incident saved.', 'success');
      if (res.frequency && res.frequency.escalation_triggered) {
        toast(res.log.student_name + ': ' + res.frequency.escalation_message, 'warning', { duration: 10000 });
      }
      state.lastSaved = { log: res.log, frequency: res.frequency };
      renderLastSaved();
      resetLogForm();
    }).catch(notifyError).then(function () {
      state.submitting = false;
      setBtnLoading(btn, false);
    });
  }

  function resetLogForm() {
    $('#logForm').reset();
    $$('#logForm .input').forEach(function (el) { setInvalid(el, false); });
    clearEvidence();
    state.freq.seq++;
    state.freq.result = null;
    state.autofill.name = false;
    state.autofill.section = false;
    $('#autofillHint').hidden = true;
    renderOffensePanel(null);
    populateFormSelects();
  }

  function renderLastSaved() {
    var card = $('#lastSavedCard');
    var ls = state.lastSaved;
    if (!ls) { card.hidden = true; return; }
    var log = ls.log;
    var busy = !!state.reportBusy[log.log_id];
    var pdf = safeUrl(log.report_pdf_link);
    var escalated = ls.frequency && ls.frequency.escalation_triggered;
    card.hidden = false;
    card.innerHTML =
      '<div class="mb-3 flex items-center gap-2 text-sm font-semibold text-blue-600 dark:text-blue-400">' + icon('check-circle', 'w-4 h-4') + 'Last saved incident</div>' +
      '<p class="text-sm font-semibold">' + esc(log.student_name) + ' <span class="font-normal muted">· ' + esc(log.student_id) + '</span></p>' +
      '<p class="mt-0.5 text-sm muted">' + esc(log.infraction) + '</p>' +
      '<div class="mt-2 flex flex-wrap gap-2">' + severityBadge(log.severity) + frequencyBadge(log.frequency) + statusBadge(log.remark_status) + '</div>' +
      (escalated ? '<p class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-xs font-semibold text-red-700 dark:bg-red-500/10 dark:text-red-300">' + esc(ls.frequency.escalation_message) + '</p>' : '') +
      '<div class="mt-4 flex flex-wrap gap-2">' +
        '<button type="button" class="btn btn-primary btn-sm" data-action="report" data-id="' + esc(log.log_id) + '"' + (busy ? ' disabled' : '') + '>' +
          (busy ? '<span class="spinner" style="width:.75rem;height:.75rem"></span>Generating…' : icon('file-text', 'w-3.5 h-3.5') + (pdf ? 'Regenerate PDF' : 'Generate Report')) +
        '</button>' +
        (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">' + icon('external', 'w-3.5 h-3.5') + 'View PDF</a>' : '') +
        (escalated ? '<button type="button" class="btn btn-secondary btn-sm" data-action="new-conference" data-id="' + esc(log.student_id) + '" data-name="' + esc(log.student_name) + '" data-section="' + esc(log.section) + '">' + icon('message', 'w-3.5 h-3.5') + 'Record Conference</button>' : '') +
      '</div>';
  }

  // ==========================================================================
  // 10. STUDENT DIRECTORY — RECORDS
  // ==========================================================================

  function setDirMode(mode) {
    state.dirMode = mode === 'students' ? 'students' : 'records';
    $$('[data-action="dir-mode"]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === state.dirMode);
    });
    $('#recordsWrap').hidden = state.dirMode !== 'records';
    $('#studentsWrap').hidden = state.dirMode !== 'students';
    $('#dirFilter').hidden = state.dirMode !== 'records';
    $('#dirSearch').placeholder = state.dirMode === 'records'
      ? 'Search by name, ID, section, infraction, sanction…'
      : 'Search students by name, ID or section…';
    if (state.dirMode === 'records') loadRecords(false); else loadStudents(false);
  }

  function loadRecords(force) {
    var r = state.records;
    if (r.loaded && !force) { renderRecords(); return; }
    var seq = ++r.seq;
    if (!r.items.length) $('#recordsWrap').innerHTML = loadingBlock('Loading records…');
    setRefreshing('directory', true);
    api('getViolations', { timeFilter: r.filter }).then(function (items) {
      if (seq !== r.seq) return;
      r.items = items || [];
      r.loaded = true;
      renderRecords();
    }).catch(function (err) {
      if (seq !== r.seq) return;
      notifyError(err);
      if (!r.items.length && !err.isAuth) $('#recordsWrap').innerHTML = emptyBlock('Could not load records', errMsg(err), 'alert');
    }).then(function () {
      if (seq === r.seq) setRefreshing('directory', false);
    });
  }

  function filteredRecords() {
    var q = state.dirSearch.trim().toLowerCase();
    if (!q) return state.records.items;
    return state.records.items.filter(function (rec) {
      return [rec.log_id, rec.student_id, rec.student_name, rec.section, rec.infraction, rec.severity, rec.frequency, rec.sanction, rec.remarks, rec.remark_status]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function pagerHtml(page, pages, start, shown, total, prevAction, nextAction) {
    if (pages <= 1) return '';
    return '<div class="flex items-center justify-between gap-3 border-t border-slate-200 px-4 py-3 dark:border-neutral-800">' +
      '<p class="text-xs muted">Showing ' + (start + 1) + '–' + (start + shown) + ' of ' + fmtNum(total) + '</p>' +
      '<div class="flex items-center gap-2">' +
        '<button type="button" class="btn btn-secondary btn-sm" data-action="' + prevAction + '"' + (page <= 1 ? ' disabled' : '') + '>Previous</button>' +
        '<span class="text-xs muted">' + page + ' / ' + pages + '</span>' +
        '<button type="button" class="btn btn-secondary btn-sm" data-action="' + nextAction + '"' + (page >= pages ? ' disabled' : '') + '>Next</button>' +
      '</div>' +
    '</div>';
  }

  function renderRecords() {
    if (state.dirMode !== 'records') return;
    var r = state.records;
    var list = filteredRecords();
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    r.page = Math.min(Math.max(1, r.page), pages);
    var start = (r.page - 1) * PAGE_SIZE;
    var slice = list.slice(start, start + PAGE_SIZE);

    $('#dirCount').textContent = fmtNum(list.length) + ' record' + (list.length === 1 ? '' : 's') + ' · ' + filterLabel(r.filter) + (state.dirSearch ? ' · matching "' + state.dirSearch + '"' : '');

    if (!list.length) {
      $('#recordsWrap').innerHTML = state.dirSearch
        ? emptyBlock('No matching records', 'Try a different search term or time period.', 'search')
        : emptyBlock('No incidents recorded', 'Logged incidents will appear here.', 'file-text');
      return;
    }

    $('#recordsWrap').innerHTML =
      '<div class="scrollbar-thin overflow-x-auto">' +
        '<table class="min-w-full divide-y divide-slate-200 dark:divide-neutral-800">' +
          '<thead class="bg-slate-50 dark:bg-neutral-950/60"><tr>' +
            '<th class="th">Date</th><th class="th">Student</th><th class="th">Section</th><th class="th">Infraction</th>' +
            '<th class="th">Severity</th><th class="th">Frequency</th><th class="th">Sanction</th><th class="th">Evidence</th><th class="th text-right">Actions</th>' +
          '</tr></thead>' +
          '<tbody class="divide-y divide-slate-200 dark:divide-neutral-800">' + slice.map(recordRow).join('') + '</tbody>' +
        '</table>' +
      '</div>' + pagerHtml(r.page, pages, start, slice.length, list.length, 'page-prev', 'page-next');
  }

  function recordRow(rec) {
    var busy = !!state.reportBusy[rec.log_id];
    var pdf = safeUrl(rec.report_pdf_link);
    var evidence = safeUrl(rec.evidence_link);
    var id = esc(rec.log_id);
    return '<tr class="hover:bg-slate-50/70 dark:hover:bg-neutral-950/40">' +
      '<td class="td whitespace-nowrap"><span class="text-sm">' + esc(rec.timestamp_display) + '</span></td>' +
      '<td class="td"><button type="button" class="text-left" data-action="view-history" data-id="' + esc(rec.student_id) + '" data-name="' + esc(rec.student_name) + '" data-section="' + esc(rec.section) + '">' +
        '<span class="block whitespace-nowrap font-semibold text-slate-900 hover:text-blue-600 dark:text-white dark:hover:text-blue-400">' + esc(rec.student_name) + '</span>' +
        '<span class="block text-xs muted">' + esc(rec.student_id) + '</span></button></td>' +
      '<td class="td whitespace-nowrap">' + esc(rec.section) + '</td>' +
      '<td class="td min-w-[180px]"><span class="font-medium">' + esc(rec.infraction) + '</span>' +
        (rec.remark_status ? '<span class="mt-1 block">' + statusBadge(rec.remark_status) + '</span>' : '') +
        (rec.remarks ? '<span class="mt-0.5 block max-w-xs truncate text-xs muted" title="' + esc(rec.remarks) + '">' + esc(rec.remarks) + '</span>' : '') + '</td>' +
      '<td class="td">' + severityBadge(rec.severity) + '</td>' +
      '<td class="td">' + frequencyBadge(rec.frequency) + '</td>' +
      '<td class="td whitespace-nowrap">' + esc(rec.sanction) + '</td>' +
      '<td class="td">' + (evidence
        ? '<a href="' + esc(evidence) + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs font-semibold text-blue-600 hover:underline dark:text-blue-400">' + icon('image', 'w-3.5 h-3.5') + 'View</a>'
        : '<span class="text-xs muted">None</span>') + '</td>' +
      '<td class="td"><div class="flex items-center justify-end gap-1.5 whitespace-nowrap">' +
        (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" title="Open PDF report">' + icon('external', 'w-3.5 h-3.5') + 'PDF</a>' : '') +
        '<button type="button" class="btn btn-primary btn-sm" data-action="report" data-id="' + id + '"' + (busy ? ' disabled' : '') + '>' +
          (busy ? '<span class="spinner" style="width:.75rem;height:.75rem"></span>Generating…' : icon('file-text', 'w-3.5 h-3.5') + (pdf ? 'Regenerate' : 'Generate Report')) +
        '</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="edit-record" data-id="' + id + '" title="Edit">' + icon('edit', 'w-4 h-4') + '</button>' +
        (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm hover:!text-red-600" data-action="delete-record" data-id="' + id + '" title="Delete">' + icon('trash', 'w-4 h-4') + '</button>' : '') +
      '</div></td>' +
    '</tr>';
  }

  function findRecord(id) {
    var items = state.records.items;
    for (var i = 0; i < items.length; i++) if (items[i].log_id === id) return items[i];
    return null;
  }

  function updateRecordLocal(id, patch) {
    var rec = findRecord(id);
    if (rec) Object.assign(rec, patch);
    if (state.lastSaved && state.lastSaved.log.log_id === id) Object.assign(state.lastSaved.log, patch);
  }

  function generateReport(id) {
    if (!id || state.reportBusy[id]) return;
    state.reportBusy[id] = true;
    renderRecords();
    renderLastSaved();
    api('generatePDFReport', id).then(function (res) {
      updateRecordLocal(id, { report_pdf_link: res.pdf_url });
      state.audit.loaded = false;
      toast('PDF report generated.', 'success', { linkUrl: res.pdf_url, linkText: 'Open PDF', duration: 12000 });
    }).catch(notifyError).then(function () {
      delete state.reportBusy[id];
      renderRecords();
      renderLastSaved();
    });
  }

  function inputField(label, id, value, opts) {
    opts = opts || {};
    return '<div' + (opts.full ? ' class="sm:col-span-2"' : '') + '><label class="label" for="' + id + '">' + esc(label) + (opts.required ? ' <span class="text-red-500">*</span>' : '') + '</label>' +
      '<input id="' + id + '" class="input" value="' + esc(value) + '"' + (opts.maxlength ? ' maxlength="' + opts.maxlength + '"' : '') + (opts.type ? ' type="' + opts.type + '"' : '') + (opts.disabled ? ' disabled' : '') + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + (opts.autocomplete ? ' autocomplete="' + opts.autocomplete + '"' : '') + '>' +
      (opts.hint ? '<p class="mt-1 text-xs muted">' + esc(opts.hint) + '</p>' : '') + '</div>';
  }

  function selectField(label, id, required) {
    return '<div><label class="label" for="' + id + '">' + esc(label) + (required === false ? '' : ' <span class="text-red-500">*</span>') + '</label><select id="' + id + '" class="input"></select></div>';
  }

  function openEditModal(id) {
    var rec = findRecord(id);
    if (!rec) { toast('Record not found. Refresh and try again.', 'error'); return; }
    openModal({
      title: 'Edit Incident Record',
      size: 'max-w-2xl',
      body:
        '<form id="editForm" data-id="' + esc(id) + '" class="space-y-4" novalidate autocomplete="off">' +
          '<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">' +
            inputField('Student ID', 'e_student_id', rec.student_id, { required: true, maxlength: 50 }) +
            inputField('Student Name', 'e_student_name', rec.student_name, { required: true, maxlength: 120 }) +
            inputField('Section', 'e_section', rec.section, { required: true, maxlength: 80 }) +
            selectField('Infraction', 'e_infraction') +
            selectField('Severity', 'e_severity') +
            selectField('Sanction', 'e_sanction') +
          '</div>' +
          '<div><label class="label">Frequency</label><input class="input" value="' + esc(rec.frequency) + '" disabled>' +
            '<p class="mt-1 text-xs muted">Recalculated automatically if the Student ID or Infraction changes.</p></div>' +
          '<div><label class="label" for="e_remark_status">Remarks</label><select id="e_remark_status" class="input mb-3"></select>' +
            '<textarea id="e_remarks" class="input min-h-[90px] resize-y" maxlength="2000" aria-label="Remarks details">' + esc(rec.remarks) + '</textarea></div>' +
          inputField('Evidence Link', 'e_evidence_link', rec.evidence_link, { maxlength: 500, type: 'url' }) +
          '<p class="text-xs muted">Record ID: <span class="font-mono">' + esc(rec.log_id) + '</span> · Logged ' + esc(rec.timestamp_display) + '</p>' +
        '</form>',
      footer:
        '<button type="button" class="btn btn-secondary" data-action="modal-close">Cancel</button>' +
        '<button type="submit" form="editForm" id="editSave" class="btn btn-primary">' + icon('check', 'w-4 h-4') + 'Save Changes</button>'
    });
    fillSelect($('#e_infraction'), activeValues('Infractions'), 'Select infraction…', rec.infraction);
    fillSelect($('#e_severity'), activeValues('Severity Levels'), 'Select severity…', rec.severity);
    fillSelect($('#e_sanction'), activeValues('Sanctions'), 'Select sanction…', rec.sanction);
    fillSelect($('#e_remark_status'), activeValues('Remarks'), 'No remark status', rec.remark_status || '');
  }

  function saveEdit(form) {
    var id = form.getAttribute('data-id');
    var fields = ['student_id', 'student_name', 'section', 'infraction', 'severity', 'sanction'];
    var firstInvalid = null;
    var payload = { log_id: id };
    fields.forEach(function (f) {
      var el = $('#e_' + f);
      var v = el.value.trim();
      setInvalid(el, !v);
      if (!v && !firstInvalid) firstInvalid = el;
      payload[f] = v;
    });
    payload.remarks = $('#e_remarks').value.trim();
    payload.remark_status = $('#e_remark_status').value;
    var linkEl = $('#e_evidence_link');
    payload.evidence_link = linkEl.value.trim();
    if (payload.evidence_link && !/^https?:\/\//i.test(payload.evidence_link)) {
      setInvalid(linkEl, true);
      if (!firstInvalid) firstInvalid = linkEl;
    }
    if (firstInvalid) { firstInvalid.focus(); return; }

    var btn = $('#editSave');
    setBtnLoading(btn, true, 'Saving…');
    api('updateViolation', payload).then(function (res) {
      updateRecordLocal(id, res.log);
      markDirty({ keepRecords: true, keepConferences: true });
      closeModal();
      renderRecords();
      renderLastSaved();
      toast(res.message || 'Record updated.', 'success');
    }).catch(function (err) {
      setBtnLoading(btn, false);
      notifyError(err);
    });
  }

  function deleteRecord(id) {
    var rec = findRecord(id);
    if (!rec) return;
    confirmDialog({
      title: 'Delete incident record?',
      message: 'This permanently removes the ' + rec.infraction + ' record for ' + rec.student_name + ' (' + rec.timestamp_display + '). The deletion is recorded in the audit log. Uploaded evidence and PDF reports stay in Google Drive.',
      confirmText: 'Delete Record',
      danger: true
    }).then(function (ok) {
      if (!ok) return;
      api('deleteViolation', id).then(function (res) {
        state.records.items = state.records.items.filter(function (r) { return r.log_id !== id; });
        if (state.lastSaved && state.lastSaved.log.log_id === id) { state.lastSaved = null; renderLastSaved(); }
        markDirty({ keepRecords: true, keepConferences: true });
        renderRecords();
        toast(res.message || 'Record deleted.', 'success');
      }).catch(notifyError);
    });
  }

  // ==========================================================================
  // 11. STUDENT DIRECTORY — STUDENTS & HISTORY
  // ==========================================================================

  function loadStudents(force) {
    var s = state.students;
    if (s.loaded && !force) { renderStudents(); return; }
    var seq = ++s.seq;
    if (!s.items.length) $('#studentsWrap').innerHTML = loadingBlock('Loading students…');
    setRefreshing('directory', true);
    api('getStudentDirectory', '').then(function (items) {
      if (seq !== s.seq) return;
      s.items = items || [];
      s.loaded = true;
      renderStudents();
    }).catch(function (err) {
      if (seq !== s.seq) return;
      notifyError(err);
      if (!s.items.length && !err.isAuth) $('#studentsWrap').innerHTML = emptyBlock('Could not load students', errMsg(err), 'alert');
    }).then(function () {
      if (seq === s.seq) setRefreshing('directory', false);
    });
  }

  function studentAttrs(s) {
    return 'data-id="' + esc(s.student_id) + '" data-name="' + esc(s.student_name) + '" data-section="' + esc(s.section) + '"';
  }

  function renderStudents() {
    if (state.dirMode !== 'students') return;
    var q = state.dirSearch.trim().toLowerCase();
    var list = state.students.items.filter(function (s) {
      return !q || [s.student_id, s.student_name, s.section].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    $('#dirCount').textContent = fmtNum(list.length) + ' student' + (list.length === 1 ? '' : 's') + ' with recorded incidents' + (q ? ' · matching "' + state.dirSearch + '"' : '');
    if (!list.length) {
      $('#studentsWrap').innerHTML = q ? emptyBlock('No matching students', 'Try a different search term.', 'search') : emptyBlock('No students yet', 'Students appear here once an incident is logged.', 'users');
      return;
    }
    $('#studentsWrap').innerHTML = '<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">' + list.map(function (s) {
      var top = (s.infraction_breakdown || []).slice(0, 3);
      return '<div class="flex flex-col rounded-2xl border ' + (s.escalated ? 'border-red-300 dark:border-red-500/40' : 'border-slate-200 dark:border-neutral-800') + ' p-4">' +
        '<div class="flex items-start gap-3">' +
          '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full ' + (s.escalated ? 'bg-red-600' : 'bg-blue-600') + ' text-sm font-bold text-white">' + esc(initials(s.student_name)) + '</span>' +
          '<div class="min-w-0 flex-1"><p class="truncate font-semibold">' + esc(s.student_name) + '</p><p class="truncate text-xs muted">' + esc(s.student_id) + ' · ' + esc(s.section) + '</p></div>' +
          '<div class="text-right"><p class="text-xl font-bold leading-none ' + (s.escalated ? 'text-red-600 dark:text-red-400' : '') + '">' + s.total_offenses + '</p><p class="text-[11px] muted">offense' + (s.total_offenses === 1 ? '' : 's') + '</p></div>' +
        '</div>' +
        (s.escalated ? '<div class="mt-3 flex flex-wrap items-center gap-2"><span class="text-xs font-semibold text-red-700 dark:text-red-300">Parent conference:</span>' + conferenceBadge(s.conference_status, s.conference_date_display) + '</div>' : '') +
        '<div class="mt-3 flex flex-wrap gap-1.5">' + top.map(function (t) {
          return '<span class="badge bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200">' + esc(t.infraction) + ' ×' + t.count + '</span>';
        }).join('') + '</div>' +
        '<div class="mt-auto flex items-center justify-between gap-2 pt-4">' +
          '<p class="flex items-center gap-1 text-xs muted">' + icon('clock', 'w-3.5 h-3.5') + esc(s.last_offense_display || '—') + '</p>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-action="view-history" ' + studentAttrs(s) + '>' + icon('eye', 'w-3.5 h-3.5') + 'History</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function openHistory(studentId, name, section) {
    openModal({
      title: 'Student History — ' + (name || studentId),
      size: 'max-w-3xl',
      body: loadingBlock('Loading history…'),
      footer:
        '<button type="button" class="btn btn-secondary" data-action="modal-close">Close</button>' +
        '<button type="button" class="btn btn-secondary" data-action="new-conference" data-id="' + esc(studentId) + '" data-name="' + esc(name) + '" data-section="' + esc(section) + '">' + icon('message', 'w-4 h-4') + 'Record Conference</button>' +
        '<button type="button" class="btn btn-primary" data-action="log-for-student" data-id="' + esc(studentId) + '" data-name="' + esc(name) + '" data-section="' + esc(section) + '">' + icon('plus', 'w-4 h-4') + 'Log New Incident</button>'
    });
    var token = studentId + '|' + Date.now();
    state.historyToken = token;
    api('getStudentHistory', studentId).then(function (data) {
      if (state.historyToken !== token || !isModalOpen()) return;
      var body = $('#modalRoot .modal-body');
      if (body) body.innerHTML = historyHtml(studentId, name, section, data.logs || [], data.conferences || []);
    }).catch(function (err) {
      var body = $('#modalRoot .modal-body');
      if (body && state.historyToken === token && !err.isAuth) body.innerHTML = emptyBlock('Could not load history', errMsg(err), 'alert');
    });
  }

  function historyHtml(studentId, name, section, items, conferences) {
    var total = items.length;
    var escalated = total >= state.threshold;
    var held = conferences.some(function (c) { return c.status === 'Held'; });
    var head =
      '<div class="mb-5 flex flex-wrap items-center gap-3">' +
        '<span class="flex h-11 w-11 items-center justify-center rounded-full ' + (escalated ? 'bg-red-600' : 'bg-blue-600') + ' text-sm font-bold text-white">' + esc(initials(name)) + '</span>' +
        '<div class="min-w-0 flex-1"><p class="font-semibold">' + esc(name) + '</p><p class="text-xs muted">' + esc(studentId) + ' · ' + esc(section) + '</p></div>' +
        '<span class="badge ' + (escalated ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-700 dark:bg-neutral-800 dark:text-neutral-200') + '">' + total + ' total offense' + (total === 1 ? '' : 's') + '</span>' +
      '</div>' +
      (escalated && !held ? '<div class="mb-5 flex gap-2 rounded-xl border border-red-200 bg-red-50 p-3 text-sm font-semibold text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300">' + icon('alert', 'w-4 h-4') + 'Threshold Reached: Recommend Parent Conference.</div>' : '');

    var confHtml = '<h4 class="mb-3 mt-2 text-xs font-semibold uppercase tracking-wide muted">Parent Conferences (' + conferences.length + ')</h4>' +
      (conferences.length
        ? '<ul class="mb-6 space-y-3">' + conferences.map(function (c) {
            return '<li class="rounded-xl border border-slate-200 p-3 dark:border-neutral-800">' +
              '<div class="flex flex-wrap items-center justify-between gap-2"><div class="flex flex-wrap items-center gap-2">' + conferenceBadge(c.status, c.conference_date_display) +
              (c.guardian_name ? '<span class="text-xs muted">with ' + esc(c.guardian_name) + '</span>' : '') + '</div>' +
              '<button type="button" class="btn btn-ghost btn-sm" data-action="edit-conference" data-conf=\'' + esc(JSON.stringify(c)) + '\'>' + icon('edit', 'w-3.5 h-3.5') + 'Edit</button></div>' +
              (c.outcome ? '<p class="mt-2 text-sm"><b>Outcome:</b> ' + esc(c.outcome) + '</p>' : '') +
              (c.notes ? '<p class="mt-1 whitespace-pre-line text-sm muted">' + esc(c.notes) + '</p>' : '') +
            '</li>';
          }).join('') + '</ul>'
        : '<p class="mb-6 text-sm muted">No conferences recorded yet.</p>');

    if (!items.length) return head + confHtml + emptyBlock('No incident records found', 'This student has no recorded incidents.', 'file-text');
    return head + confHtml + '<h4 class="mb-3 text-xs font-semibold uppercase tracking-wide muted">Incidents</h4>' +
      '<ol class="relative space-y-5 border-l-2 border-slate-200 pl-6 dark:border-neutral-800">' + items.map(function (r) {
      var pdf = safeUrl(r.report_pdf_link);
      var ev = safeUrl(r.evidence_link);
      return '<li class="relative">' +
        '<span class="absolute -left-[31px] top-1 h-3 w-3 rounded-full border-2 border-white bg-blue-600 dark:border-neutral-900"></span>' +
        '<div class="flex flex-wrap items-center gap-2"><p class="text-sm font-semibold">' + esc(r.infraction) + '</p>' + severityBadge(r.severity) + frequencyBadge(r.frequency) + statusBadge(r.remark_status) + '</div>' +
        '<p class="mt-1 text-xs muted">' + esc(r.timestamp_display) + ' · Sanction: <b class="text-slate-700 dark:text-neutral-200">' + esc(r.sanction) + '</b></p>' +
        (r.remarks ? '<p class="mt-2 whitespace-pre-line rounded-lg bg-slate-50 p-3 text-sm dark:bg-neutral-950">' + esc(r.remarks) + '</p>' : '') +
        ((ev || pdf) ? '<div class="mt-2 flex flex-wrap gap-3 text-xs font-semibold">' +
          (ev ? '<a href="' + esc(ev) + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-blue-600 hover:underline dark:text-blue-400">' + icon('image', 'w-3.5 h-3.5') + 'Evidence</a>' : '') +
          (pdf ? '<a href="' + esc(pdf) + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-blue-600 hover:underline dark:text-blue-400">' + icon('file-text', 'w-3.5 h-3.5') + 'PDF Report</a>' : '') +
        '</div>' : '') +
      '</li>';

  function logForStudent(id, name, section) {
    closeModal();
    showView('log');
    resetLogForm();
    $('#f_student_id').value = id || '';
    $('#f_student_name').value = name || '';
    $('#f_section').value = section || '';

  // 12. ESCALATION WATCHLIST

  function loadWatchlist(force) {
    var w = state.watchlist;
    if (w.loaded && !force) { renderWatchlist(); return; }
    var seq = ++w.seq;
    if (!w.items.length) $('#watchlistWrap').innerHTML = loadingBlock('Loading watchlist…');
    setRefreshing('watchlist', true);
    api('getEscalationWatchlist').then(function (items) {
      if (seq !== w.seq) return;
      w.items = items || [];
      w.loaded = true;
      updateWatchlistBadge(w.items.length);
      renderWatchlist();
    }).catch(function (err) {
      if (seq !== w.seq) return;
      notifyError(err);
      if (!w.items.length && !err.isAuth) $('#watchlistWrap').innerHTML = emptyBlock('Could not load watchlist', errMsg(err), 'alert');
    }).then(function () {
      if (seq === w.seq) setRefreshing('watchlist', false);
    });
  }

  function renderWatchlist() {
    var items = state.watchlist.items;
    if (!items.length) {
      $('#watchlistWrap').innerHTML = emptyBlock('No students on the watchlist', 'No student has reached ' + state.threshold + ' recorded offenses yet.', 'check-circle');

        '<thead class="bg-slate-50 dark:bg-neutral-950/60"><tr>' +
